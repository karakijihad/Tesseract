<svg xmlns="http://www.w3.org/2000/svg" width="936" height="340" viewBox="0 0 936 340" role="img" aria-label="The agent loop, one operator message end to end. A budget check, pending signals and a memory recall assemble the prompt; the model replies; each tool call is judged by the permission gate and its result re-enters the same turn, up to eighty times; the finished turn is saved to history. The observer sits above the loop: it watches the finished turn, and its suggestions are folded into the next one."><title>L2-agent-loop</title><desc>The agent loop, one operator message end to end. A budget check, pending signals and a memory recall assemble the prompt; the model replies; each tool call is judged by the permission gate and its result re-enters the same turn, up to eighty times; the finished turn is saved to history. The observer sits above the loop: it watches the finished turn, and its suggestions are folded into the next one.</desc>
  <defs>
    <marker id="t-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#868692"/>
    </marker>
    <marker id="t-arw-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c6cf0"/>
    </marker>
    <marker id="t-arw-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <linearGradient id="t-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16162a"/><stop offset="100%" stop-color="#101020"/>
    </linearGradient>
    <linearGradient id="t-live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221d47"/><stop offset="100%" stop-color="#171233"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="936" height="340" fill="#0b0b16"/>

  <!-- lane bands. The observer sits in its own band ABOVE the loop, so both of
       its paths are one straight run each instead of threading four corners. -->
  <rect x="0" y="18" width="936" height="64" rx="4" fill="rgba(34,211,238,0.03)"/>
  <rect x="0" y="110" width="936" height="72" rx="4" fill="rgba(255,255,255,0.016)"/>
  <rect x="0" y="226" width="936" height="72" rx="4" fill="rgba(255,255,255,0.016)"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1.4" fill="rgba(234,234,248,0.38)">
    <text x="8" y="12">ACROSS TURNS</text>
    <text x="8" y="102">ASSEMBLE</text>
    <text x="8" y="218">GENERATE</text>
  </g>

  <!-- the observer -->
  <rect x="360" y="30" width="132" height="42" rx="3" fill="url(#t-node)" stroke="#22d3ee" stroke-width="1.2"/>
  <line x1="366" y1="30" x2="366" y2="72" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="426" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">observer</text>
  <text x="426" y="63" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">suggests what to keep</text>

  <!-- assemble -->
  <g stroke="rgba(234,234,248,0.55)" stroke-width="1" fill="url(#t-node)">
    <rect x="16" y="124" width="132" height="46" rx="3"/>
    <rect x="188" y="124" width="132" height="46" rx="3"/>
    <rect x="360" y="124" width="132" height="46" rx="3"/>
    <rect x="532" y="124" width="132" height="46" rx="3"/>
    <rect x="704" y="124" width="132" height="46" rx="3"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f5f5fa" text-anchor="middle">
    <text x="82" y="146">your message</text>
    <text x="254" y="146">checks budget</text>
    <text x="426" y="146">pending signals</text>
    <text x="598" y="146">recalls memory</text>
    <text x="770" y="146">prompt built</text>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(234,234,248,0.55)" text-anchor="middle">
    <text x="254" y="162">cost preflight</text>
    <text x="426" y="162">drains</text>
    <text x="598" y="162">L2 · memory</text>
    <text x="770" y="162">assembled</text>
  </g>
  <g stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#t-arw)">
    <line x1="148" y1="147" x2="184" y2="147"/>
    <line x1="320" y1="147" x2="356" y2="147"/>
    <line x1="492" y1="147" x2="528" y2="147"/>
    <line x1="664" y1="147" x2="700" y2="147"/>
  </g>

  <!-- generate, running right to left -->
  <rect x="704" y="240" width="132" height="46" rx="3" fill="url(#t-live)" stroke="#7c6cf0" stroke-width="1.5"/>
  <text x="770" y="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9d8fff" text-anchor="middle">model replies</text>
  <text x="770" y="278" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(234,234,248,0.55)" text-anchor="middle">text · tool calls</text>
  <line x1="770" y1="170" x2="770" y2="236" stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#t-arw)"/>

  <polygon points="532,263 549,240 647,240 664,263 647,286 549,286" fill="url(#t-node)" stroke="#ffb454" stroke-width="1.3"/>
  <text x="598" y="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffb454" text-anchor="middle">permission</text>
  <text x="598" y="275" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#ffb454" text-anchor="middle">AUTO · ASK · DENY</text>

  <g stroke="rgba(234,234,248,0.55)" stroke-width="1" fill="url(#t-node)">
    <rect x="360" y="240" width="132" height="46" rx="3"/>
    <rect x="188" y="240" width="132" height="46" rx="3"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f5f5fa" text-anchor="middle">
    <text x="426" y="262">runs the tool</text>
    <text x="254" y="262">the result</text>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(234,234,248,0.55)" text-anchor="middle">
    <text x="426" y="278">118 registered</text>
    <text x="254" y="278">appended</text>
  </g>
  <g stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#t-arw)">
    <line x1="700" y1="263" x2="668" y2="263"/>
    <line x1="528" y1="263" x2="496" y2="263"/>
    <line x1="356" y1="263" x2="324" y2="263"/>
  </g>
  <rect x="568.5" y="220.8" width="59.4" height="11.0" fill="#0b0b16"/><text x="598" y="229" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">tool call</text>

  <!-- a tool result re-enters the same turn rather than ending it -->
  <path d="M188 273 L150 273 L150 312 L788 312 L788 290" fill="none" stroke="#7c6cf0" stroke-width="1.3" marker-end="url(#t-arw-v)"/>
  <rect x="391.9" y="303.8" width="162.2" height="11.0" fill="#0b0b16"/><text x="473" y="312" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#9d8fff" text-anchor="middle">goes round again · up to 80</text>

  <!-- the finished turn is kept, and the arrow has room for its own head -->
  <rect x="856" y="240" width="72" height="46" rx="3" fill="url(#t-node)" stroke="rgba(234,234,248,0.55)" stroke-width="1"/>
  <text x="892" y="259" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f5f5fa" text-anchor="middle">saved</text>
  <text x="892" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(234,234,248,0.55)" text-anchor="middle">to history</text>
  <line x1="836" y1="263" x2="852" y2="263" stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#t-arw)"/>

  <!-- up, then left. two segments, no corners threaded through the loop. -->
  <path d="M892 236 L892 51 L496 51" fill="none" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#t-arw-c)"/>
  <rect x="618.6" y="42.8" width="150.7" height="11.0" fill="#0b0b16"/><text x="694" y="51" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#22d3ee" text-anchor="middle">watches the finished turn</text>

  <!-- straight down into the next turn's assembly -->
  <path d="M426 76 L426 120" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#t-arw-c)"/>
  <text x="440" y="102" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#22d3ee">folded into the next turn</text>
</svg>
