<svg xmlns="http://www.w3.org/2000/svg" width="936" height="296" viewBox="0 0 936 296" role="img" aria-label="The operator speaks or types to the Agent and it answers. It remembers the operator across sessions. Writing a file and running a command both pass a gate the operator controls: it asks first, every time."><title>L0-what-it-does</title><desc>The operator speaks or types to the Agent and it answers. It remembers the operator across sessions. Writing a file and running a command both pass a gate the operator controls: it asks first, every time.</desc>
  <defs>
    <marker id="w-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#868692"/>
    </marker>
    <marker id="w-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f7dff"/>
    </marker>
    <marker id="w-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <linearGradient id="w-you" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2358"/><stop offset="100%" stop-color="#161230"/>
    </linearGradient>
    <linearGradient id="w-sys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1b2f"/><stop offset="100%" stop-color="#111120"/>
    </linearGradient>
    <linearGradient id="w-gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2e0f"/><stop offset="100%" stop-color="#211906"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="936" height="296" fill="#0b0b16"/>

  <!-- memory: kept state, not the answer coming back — so it hangs above the
       assistant on its own short loop rather than riding the reply path -->
  <rect x="342" y="18" width="124" height="46" rx="4" fill="url(#w-sys)" stroke="#22d3ee" stroke-width="1.2"/>
  <line x1="348" y1="18" x2="348" y2="64" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="404" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">remembers</text>
  <text x="404" y="54" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="9" fill="rgba(234,234,248,0.5)" text-anchor="middle">across sessions</text>
  <path d="M404 64 L404 88" fill="none" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#w-c)" marker-start="url(#w-c)"/>
  <text x="418" y="80" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="9" fill="rgba(34,211,238,0.75)">carried forward</text>

  <!-- you: the only human on the page, and the only thing that grants consent -->
  <rect x="24" y="108" width="112" height="80" rx="5" fill="url(#w-you)" stroke="#8f7dff" stroke-width="1.8"/>
  <text x="80" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#b9adff" text-anchor="middle">operator</text>

  <!-- the assistant -->
  <rect x="300" y="92" width="208" height="112" rx="5" fill="url(#w-sys)" stroke="rgba(234,234,248,0.4)" stroke-width="1.2"/>
  <text x="404" y="142" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f2f2f8" text-anchor="middle">Agent</text>
  <text x="404" y="164" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="10" fill="rgba(234,234,248,0.5)" text-anchor="middle">runs on your machine</text>

  <!-- the relationship: violet is reserved for it -->
  <path d="M140 130 L294 130" fill="none" stroke="#8f7dff" stroke-width="1.4" marker-end="url(#w-v)"/>
  <text x="217" y="122" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="9.5" fill="#b9adff" text-anchor="middle">speak or type</text>
  <path d="M294 168 L140 168" fill="none" stroke="#8f7dff" stroke-width="1.4" marker-end="url(#w-v)"/>
  <text x="217" y="186" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="9.5" fill="#b9adff" text-anchor="middle">it answers</text>

  <!-- the gate: the largest, brightest object, and the only way through -->
  <polygon points="532,148 576,94 666,94 710,148 666,202 576,202" fill="url(#w-gate)" stroke="#ffb454" stroke-width="2.2"/>
  <text x="621" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#ffc472" text-anchor="middle">asks first</text>
  <text x="621" y="168" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="9.5" fill="#ffb454" text-anchor="middle">in its default mode</text>

  <line x1="508" y1="148" x2="528" y2="148" stroke="rgba(234,234,248,0.5)" stroke-width="1.4" marker-end="url(#w-g)"/>
  <line x1="714" y1="148" x2="752" y2="148" stroke="rgba(234,234,248,0.5)" stroke-width="1.4" marker-end="url(#w-g)"/>

  <!-- the world: everything that has consequences -->
  <rect x="756" y="100" width="156" height="96" rx="5" fill="url(#w-sys)" stroke="rgba(234,234,248,0.28)" stroke-width="1"/>
  <g font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="12" fill="rgba(234,234,248,0.72)" text-anchor="middle">
    <text x="834" y="130">writing a file</text>
    <text x="834" y="152">running a command</text>
    <text x="834" y="174">touching anything</text>
  </g>

  <text x="468" y="252" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="rgba(234,234,248,0.72)" text-anchor="middle">It gets to know you. It stops and asks before it touches anything.</text>
  <text x="468" y="274" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="10" fill="rgba(234,234,248,0.34)" text-anchor="middle">the rest of this guide opens each of these up</text>
</svg>
