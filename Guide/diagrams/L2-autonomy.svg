<svg xmlns="http://www.w3.org/2000/svg" width="936" height="356" viewBox="0 0 936 356" role="img" aria-label="Autonomy: what you ask for and what the runtime reports enter one queue; the admission gate drops duplicates and over-cap drafts into the prune ledger; survivors are scored on the agenda, cleared by the governor, dispatched to a worker, and recorded in the journal, whose outcomes become events again."><title>L2-autonomy</title><desc>Autonomy: what you ask for and what the runtime reports enter one queue; the admission gate drops duplicates and over-cap drafts into the prune ledger; survivors are scored on the agenda, cleared by the governor, dispatched to a worker, and recorded in the journal, whose outcomes become events again.</desc><rect x="0" y="0" width="936" height="356" fill="#0b0b16"/>
      <defs>
        <marker id="n-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#868692"/>
        </marker>
        <marker id="n-arw-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#ff6b6b"/>
        </marker>
        <marker id="n-arw-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#7c6cf0"/>
        </marker>
        <linearGradient id="n-node" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16162a"/><stop offset="100%" stop-color="#101020"/>
        </linearGradient>
      </defs>

      <rect x="0" y="42" width="936" height="128" rx="4" fill="rgba(255,255,255,0.016)"/>
      <rect x="0" y="196" width="936" height="88" rx="4" fill="rgba(255,255,255,0.016)"/>
      <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1.4" fill="rgba(234,234,248,0.38)">
        <text x="8" y="34">ENTER &amp; ACT</text>
        <text x="8" y="188">RECORD</text>
      </g>

      <g stroke="#22d3ee" stroke-width="1.2" fill="url(#n-node)">
        <rect x="16" y="76" width="140" height="34" rx="3"/>
        <rect x="16" y="126" width="140" height="34" rx="3"/>
      </g>
      <line x1="22" y1="76" x2="22" y2="110" stroke="#22d3ee" stroke-width="1.2"/>
      <line x1="22" y1="126" x2="22" y2="160" stroke="#22d3ee" stroke-width="1.2"/>
      <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#f5f5fa" text-anchor="middle">
        <text x="86" y="97">you ask</text>
        <text x="86" y="147">something happened</text>
      </g>
      <text x="86" y="176" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">recovery · probe · follow-up</text>

      <polygon points="212,114 233,90 323,90 344,114 323,138 233,138" fill="url(#n-node)" stroke="#ffb454" stroke-width="1.4"/>
      <text x="278" y="111" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffb454" text-anchor="middle">dedupes and caps</text>
      <text x="278" y="126" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#ffb454" text-anchor="middle">admission</text>
      <g stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#n-arw)">
        <line x1="156" y1="93" x2="208" y2="107"/>
        <line x1="156" y1="143" x2="208" y2="126"/>
      </g>
      <text x="278" y="158" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#4ade80" text-anchor="middle">no model decides what enters</text>

      <rect x="212" y="212" width="132" height="40" rx="3" fill="url(#n-node)" stroke="#ff6b6b" stroke-width="1.2"/>
      <line x1="218" y1="212" x2="218" y2="252" stroke="#ff6b6b" stroke-width="1.2"/>
      <text x="278" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ff6b6b" text-anchor="middle">dropped, kept</text>
      <text x="278" y="244" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">prune ledger</text>
      <line x1="278" y1="138" x2="278" y2="208" stroke="#ff6b6b" stroke-width="1.2" marker-end="url(#n-arw-r)"/>

      <rect x="400" y="90" width="132" height="48" rx="3" fill="url(#n-node)" stroke="rgba(234,234,248,0.55)"/>
      <text x="466" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f5f5fa" text-anchor="middle">the queue</text>
      <text x="466" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">agenda</text>
      <line x1="344" y1="114" x2="396" y2="114" stroke="#4ade80" stroke-width="1.2" marker-end="url(#n-arw)"/>
      <rect x="348.0" y="89.8" width="48.0" height="11.0" fill="#0b0b16"/><text x="372" y="98" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#4ade80" text-anchor="middle">kept</text>

      <polygon points="588,114 606,90 702,90 720,114 702,138 606,138" fill="url(#n-node)" stroke="#ffb454" stroke-width="1.4"/>
      <text x="654" y="111" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffb454" text-anchor="middle">checks the budget</text>
      <text x="654" y="126" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#ffb454" text-anchor="middle">governor</text>
      <line x1="532" y1="114" x2="584" y2="114" stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#n-arw)"/>

      <rect x="776" y="90" width="132" height="48" rx="3" fill="url(#n-node)" stroke="#7c6cf0" stroke-width="1.5"/>
      <text x="842" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9d8fff" text-anchor="middle">does the work</text>
      <text x="842" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">worker · top-K</text>
      <line x1="720" y1="114" x2="772" y2="114" stroke="#7c6cf0" stroke-width="1.2" marker-end="url(#n-arw-v)"/>

      <rect x="776" y="212" width="132" height="40" rx="3" fill="url(#n-node)" stroke="#22d3ee" stroke-width="1.2"/>
      <line x1="782" y1="212" x2="782" y2="252" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="842" y="237" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">records outcomes</text>
      <line x1="842" y1="138" x2="842" y2="208" stroke="rgba(234,234,248,0.55)" stroke-width="1.1" marker-end="url(#n-arw)"/>
      <rect x="859.0" y="169.8" width="48.0" height="11.0" fill="#0b0b16"/><text x="883" y="178" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">journal</text>

      <path d="M842 252 L842 312 L90 312 L90 164" fill="none" stroke="rgba(234,234,248,0.38)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#n-arw)"/>
      <rect x="345.0" y="307.8" width="242.1" height="11.0" fill="#0b0b16"/><text x="466" y="316" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="rgba(234,234,248,0.55)" text-anchor="middle">outcomes are events too — the loop closes</text>
</svg>
