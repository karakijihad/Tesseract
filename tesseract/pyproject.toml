[project]
name = "tesseract"
version = "1.0.0"
description = "TESSERACT kernel — local-first AI entity runtime"
requires-python = ">=3.12"
dependencies = [
    # Core — Mirror server runs on aiohttp; httpx is the async HTTP client
    "aiohttp>=3.10",
    "httpx>=0.27.0",
    "pydantic>=2.0.0,<3",

    # AI adapters — Claude CLI + Codex CLI via delegate_* tools, plus the
    # Anthropic SDK for direct API calls (cost-tracked role fallbacks).
    # `google-genai` covers chat_brain Gemini fallback, voice STT
    # (Gemini Flash audio), and voice TTS (Gemini Flash TTS) on a single
    # GOOGLE_API_KEY — no OAuth2 / ADC anywhere in the runtime.
    "openai>=1.40.0",
    "anthropic>=0.88.0",
    "google-genai>=1.0.0",
    "faster-whisper>=1.1.0",

    # Memory
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",

    # Config
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "python-dotenv>=1.0.0",

    # System metrics (Phase 0b)
    # nvidia-ml-py provides `import pynvml`; nvmlInit() is wrapped in try/except
    # so the server runs normally on non-NVIDIA machines.
    "psutil>=5.9",
    "nvidia-ml-py>=12.555",

    # Tool deps
    "pypdf>=5.0.0",  # pdf_read tool
    "python-pptx>=1.0.0",  # vault_indexer .pptx slide+notes extraction (AU-22)
    "playwright>=1.40",  # P4-2 browser automation — headless Chromium via BrowserManager

    # Scheduler (S0) — cron cadence matching for the heartbeat tick loop
    "croniter>=2.0",

    # Phase 18 — auto-config-reflection: watchdog observes
    # tesseract/config/*.yaml and pings the Mirror in-process so adapters,
    # permissions, schedule jobs, and vault config reflect external edits
    # without a restart.
    "watchdog>=4.0",

    # 2026-05-24 — Textual TUI for the ``tars`` CLI. Replaces the bare
    # ANSI renderer with a real interactive app: scrollable transcript,
    # collapsible tool blocks, status bar, real input field with line
    # editing + history. Headless fallback path (``--legacy``) keeps the
    # old renderer for CI / piped stdout.
    "textual>=0.80",

    # 2026-07-17 — official Model Context Protocol SDK. Powers the outbound
    # MCP *client* (curated allowlist in mcp_servers.yaml): ClientSession +
    # stdio_client / streamable_http_client. Capability-growth Phase 2.
    "mcp>=1.12",
]

[project.optional-dependencies]
# GPU acceleration — opt-in only. The app is CPU-only by design (faster-whisper
# and the TTS engines both fall back to CPU). Install with `pip install -e .[gpu]`
# on a machine with an NVIDIA card; a shipped install never pulls these.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10; platform_system == 'Windows'",
    "nvidia-cudnn-cu12>=9.21.1.3; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]
# WS4a-2 — Windows ConPTY backend for the embedded terminal panel.
# `pip install tesseract[terminal]` on Windows; Linux/Mac use stdlib `pty`.
terminal = [
    "pywinpty>=2.0.13; sys_platform == 'win32'",
]
# Local TTS — Piper (CPU-only, baked-in voice) and Kokoro (GPU/CPU,
# style-embedding blend; needs onnxruntime + the CUDA 12 wheels on
# Windows so the CUDAExecutionProvider can resolve its DLLs). Both
# voice models are operator-downloaded into
# `tesseract/voice/models/{piper,kokoro}/`; pip only ships the runtime.
voice-local = [
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.5.0",
    "onnxruntime-gpu>=1.20; platform_system == 'Windows'",
    "onnxruntime>=1.20; platform_system != 'Windows'",
    "nvidia-cuda-runtime-cu12; platform_system == 'Windows'",
    "nvidia-cuda-nvrtc-cu12; platform_system == 'Windows'",
    "nvidia-cufft-cu12; platform_system == 'Windows'",
    "nvidia-curand-cu12; platform_system == 'Windows'",
    "nvidia-cusparse-cu12; platform_system == 'Windows'",
    "nvidia-cusolver-cu12; platform_system == 'Windows'",
]

# TC-6 — `tars` console script. Operator types `tars` in any shell and
# the TUI client attaches to the running controller daemon.
[project.scripts]
tars = "tesseract.scripts.tars_cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Self-referential layout: ``pyproject.toml`` lives INSIDE the
# ``tesseract`` package directory. Tell setuptools that the package
# root is one level up so ``packages.find`` discovers ``tesseract/``
# as a top-level package and the editable .pth file adds the right
# parent directory to sys.path. Without this, the editable install
# succeeds but ``import tesseract`` fails with ``ModuleNotFoundError``
# because the .pth finder MAPPING ends up empty.
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["tesseract*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live-LLM smoke tests; requires TARS_RUN_LIVE_LLM=1",
]
