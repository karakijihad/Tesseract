[project]
name = "tesseract"
version = "1.1.1"
description = "TESSERACT kernel — local-first AI entity runtime"
# Declared here as well as in the repo-root LICENSE, because they are read by
# different things: GitHub and humans read the file, while pip, SBOM tools and
# dependency scanners read only this field. Without it an installed TESSERACT
# reports no licence at all, which for an AGPL project is the one claim that
# must not go missing.
#
# A bare SPDX string is PEP 639 and needs setuptools >= 77.0.3 — see the
# matching floor under [build-system]. The two move together; raising this
# without that produces an install that fails on the user's machine.
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Core — Mirror server runs on aiohttp; httpx is the async HTTP client
    "aiohttp>=3.10",
    "httpx>=0.27.0",
    "pydantic>=2.0.0,<3",

    # AI adapters — Claude CLI + Codex CLI via delegate_* tools, plus the
    # Anthropic SDK for direct API calls (cost-tracked role fallbacks).
    # `google-genai` covers the chat_brain Gemini fallback and voice STT
    # (Gemini Flash audio) on a single GOOGLE_API_KEY — no OAuth2 / ADC
    # anywhere in the runtime. TTS is local; there is no cloud lane.
    "openai>=1.40.0",
    "anthropic>=0.88.0",
    "google-genai>=1.0.0",
    "faster-whisper>=1.1.0",

    # Memory
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    # Reranker tokenization (~7 MB Rust wheel). The ONNX runtime itself comes
    # transitively via kokoro-onnx; model files are fetched separately
    # (scripts/fetch_reranker_model.py) and absent files degrade cleanly.
    "tokenizers>=0.20",

    # Config
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "python-dotenv>=1.0.0",

    # System metrics (Phase 0b)
    # nvidia-ml-py provides `import pynvml`; nvmlInit() is wrapped in try/except
    # so the server runs normally on non-NVIDIA machines.
    "psutil>=5.9",
    "nvidia-ml-py>=12.555",

    # Tool deps
    # Pillow backs `screen_look`'s capture (ImageGrab reads the composited
    # desktop; the tool crops to the app window). It arrives transitively via
    # python-pptx today, which is exactly the shape that has bitten this file
    # before — a dependency nobody declared going missing is a silent failure,
    # and here the failure is the assistant quietly losing its eyes.
    "pillow>=10.0.0",
    "pypdf>=5.0.0",  # pdf_read tool
    "python-pptx>=1.0.0",  # vault_indexer .pptx slide+notes extraction (AU-22)
    "playwright>=1.40",  # P4-2 browser automation — headless Chromium via BrowserManager

    # Scheduler (S0) — cron cadence matching for the heartbeat tick loop
    "croniter>=2.0",

    # Phase 18 — auto-config-reflection: watchdog observes
    # tesseract/config/*.yaml and pings the Mirror in-process so adapters,
    # permissions, schedule jobs, and vault config reflect external edits
    # without a restart.
    "watchdog>=4.0",

    # 2026-05-24 — Textual TUI for the ``agent`` CLI. Replaces the bare
    # ANSI renderer with a real interactive app: scrollable transcript,
    # collapsible tool blocks, status bar, real input field with line
    # editing + history. Headless fallback path (``--legacy``) keeps the
    # old renderer for CI / piped stdout.
    "textual>=0.80",

    # 2026-07-17 — official Model Context Protocol SDK. Powers the outbound
    # MCP *client* (curated allowlist in mcp_servers.yaml): ClientSession +
    # stdio_client / streamable_http_client. Capability-growth Phase 2.
    # <2 pin: mcp 2.0.0 drops `streamablehttp_client` from
    # `mcp.client.streamable_http` — an unpinned fresh install resolved 2.0.0
    # and the outbound client failed at import on every boot (found live
    # 2026-07-30). transport.py is written against the 1.x API.
    "mcp>=1.12,<2",

    # WS4a-2 — Windows ConPTY backend for the embedded terminal panel.
    # Core (not an extra): the provisioner installs bare `-e`, and a missing
    # winpty used to kill the Mirror backend at import (2026-07-29 crash
    # storm on a fresh install). Linux/Mac use stdlib `pty`.
    "pywinpty>=2.0.13; sys_platform == 'win32'",

    # Local TTS runtime — core, not an extra, because the provisioner
    # installs bare `-e` with no extras: an engine parked in an extra is
    # never installed on a packaged app, and the failure is silent (the lane
    # just latches disabled). A shipped engine went mute exactly that way
    # once already, found live 2026-07-30.
    #
    # Kokoro is the default voice (`roles.yaml::voice.tts.primary`) and
    # downloads its model files on first run; CPU onnxruntime arrives
    # transitively with it. GPU acceleration stays in the opt-in
    # [voice-local] extra — it is a speedup, not a requirement, and Kokoro
    # falls back to CPU cleanly without it. The lane behind Kokoro is the
    # cloud one, which needs no package at all.
    "kokoro-onnx>=0.5.0",
]

[project.optional-dependencies]
# GPU acceleration — opt-in only. The app is CPU-only by design (faster-whisper
# and the TTS engines both fall back to CPU). Install with `pip install -e .[gpu]`
# on a machine with an NVIDIA card; a shipped install never pulls these.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10; platform_system == 'Windows'",
    "nvidia-cudnn-cu12>=9.21.1.3; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]
# GPU acceleration for the local TTS engine — opt-in only. The engine
# itself is a core dependency (see above) and runs on CPU without any of
# this; the CUDA 12 wheels are here so Kokoro's CUDAExecutionProvider can
# resolve its DLLs on Windows. Voice models are downloaded into
# `runtime/models/voice/kokoro/`; pip only ships the runtime.
#
# Installing this extra is NOT sufficient on its own, for two reasons, both
# measured rather than assumed:
#
# 1. The upper bound is load-bearing. onnxruntime-gpu 1.27 moved to CUDA 13
#    and asks the loader for `cublasLt64_13.dll`, which the cu12 wheels
#    beside it do not provide; the session then falls back to CPU silently,
#    reporting CUDAExecutionProvider as *available* the whole time. 1.26 is
#    the last CUDA 12 build — verified against this catalog's Kokoro model.
# 2. `onnxruntime` (CPU) arrives transitively via kokoro-onnx and
#    unpacks into the same `onnxruntime/` directory. Resolvers treat it as a
#    separate distribution, so it is reinstalled by any later editable
#    install and whichever landed last wins. It has to be REMOVED after the
#    install, which no extra can express — `scripts/provision_hardware.py`
#    owns that step.
voice-local = [
    "onnxruntime-gpu>=1.20,<1.27; platform_system == 'Windows'",
    # cuBLAS and cuDNN are ALSO in [gpu], and both extras need them: the CUDA
    # execution provider links against them exactly as CTranslate2 does, and
    # `onnxruntime_providers_cuda.dll` will not load without them on the DLL
    # search path. Declaring them only in [gpu] meant a machine that wanted
    # Kokoro on the GPU but had declined speech-to-text installed a stack
    # that could never resolve, and silently synthesised on the CPU.
    "nvidia-cublas-cu12>=12.9.2.10; platform_system == 'Windows'",
    "nvidia-cudnn-cu12>=9.21.1.3; platform_system == 'Windows'",
    "nvidia-cuda-runtime-cu12; platform_system == 'Windows'",
    "nvidia-cuda-nvrtc-cu12; platform_system == 'Windows'",
    "nvidia-cufft-cu12; platform_system == 'Windows'",
    "nvidia-curand-cu12; platform_system == 'Windows'",
    "nvidia-cusparse-cu12; platform_system == 'Windows'",
    "nvidia-cusolver-cu12; platform_system == 'Windows'",
]

# TC-6 — `agent` console script. Operator types `agent` in any shell and
# the TUI client attaches to the running controller daemon.
[project.scripts]
agent = "tesseract.scripts.agent_cli:main"

[build-system]
# >= 77.0.3 is what understands PEP 639's `license = "<SPDX>"` string above.
# Older setuptools rejects it outright, and this file is what the installer
# runs `pip install -e .` against on every user's machine — so the floor and
# the field are one change, never two.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Self-referential layout: ``pyproject.toml`` lives INSIDE the
# ``tesseract`` package directory. Tell setuptools that the package
# root is one level up so ``packages.find`` discovers ``tesseract/``
# as a top-level package and the editable .pth file adds the right
# parent directory to sys.path. Without this, the editable install
# succeeds but ``import tesseract`` fails with ``ModuleNotFoundError``
# because the .pth finder MAPPING ends up empty.
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["tesseract*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live-LLM smoke tests; requires TESSERACT_RUN_LIVE_LLM=1",
]
