# Tool permission policy.
#
# Three postures per tool:
#   auto - runs immediately, no prompt (read-only, self-state, memory writes)
#   ask  - you see an approval prompt (writes, outbound calls, subprocess)
#   deny - blocked outright
#
# Two security modes:
#   max   - the default, and what the `tools:` block below describes. Writes,
#           outbound calls and commands all ask, so you see and approve what
#           the assistant does until you know how it behaves.
#   free  - the assistant acts without asking. `modes.free` lists the few
#           tools that still ask and gives every other tool auto, so a tool
#           added by a later update is covered without you editing anything.
#           For unattended runs, not for first use.
#
# A separate security layer in `permissions/bash_security.py` always fires
# regardless of mode, and no mode can relax it. This file controls auto versus
# ask only. A tool set to `deny` stays denied in both modes.
security_mode: max

# Default posture per tool. This is what `max` is.
tools:
  # Read-only — runs without asking
  memory_search: auto
  recall_history: auto            # read-only work-history retrieval (sessions + workshop); never promotes to memory
  pdf_read: auto
  context7_lookup: auto
  vault_query: auto
  vault_search: auto
  vault_lint: auto              # reads vault + appends LINT-REPORT.md (report surface, non-destructive)
  conscience_status: auto       # read-only pull of the latest drift report
  breaker_status: auto          # read-only: what the runtime has stopped trying, and what that cost

  # Self-state — the assistant manages its own interior
  set_mood: auto
  set_state: auto             # discrete orb-state command — pure UI signal, no I/O
  memory_save: auto
  memory_update: auto
  memory_forget: auto
  alarm_set: auto             # agent-owned scheduler — same backing store as /alarm-set slash
  alarm_list: auto            # read-only over the alarm registry
  alarm_cancel: auto          # mutates the assistant's own alarm queue, no external I/O
  alarm_snooze: auto          # mutates the assistant's own alarm queue, no external I/O
  # Diary is the assistant's private first-person reflection log — AUTO write,
  # operator never sees prompts for it. Distilled into SOUL.md Growth
  # by the librarian; raw entries stay in tesseract/memory-store/diary/.
  diary_append: auto
  # Operator-visible task checklist, Claude Code TodoWrite analog. State
  # lives on ToolContext.todos for the session; WS emits `tasks_state`
  # envelope on mutation. AUTO — the checklist is for operator visibility,
  # not a write to anything the operator hasn't already authorized via the
  # parent turn.
  tasks_set: auto
  tasks_update: auto
  # Control plane for background-spawn delegates and (in a follow-up)
  # invoke_agent. spawn_check is read-only; spawn_await consumes the task;
  # spawn_cancel terminates. AUTO — the underlying delegate_* tool already
  # had its operator-attended ASK at spawn time. These three just inspect /
  # await / kill an already-authorized handle.
  spawn_check: auto
  spawn_await: auto
  spawn_cancel: auto
  # SOUL Growth bullets queue a `change_proposal` event in the workspace
  # inbox; operator approves there. No chat ASK — workspace is the gate.
  soul_growth_propose: auto
  # Generic operator-gated proposal for any operator-owned workspace .md
  # file (SOUL, USER, OPERATING, …). Same pattern: writes a
  # `change_proposal` inbox event; commit happens on workspace Approve.
  propose_change: auto

  # Writes + outbound + subprocess
  #
  # Tools that are operator-visible (PTY panes, delegate spawns), cost-capped
  # (image_generate — paid per-image on both chain entries), or
  # protected by another layer (`file_write` by path_overrides) are AUTO
  # so the assistant can run without per-call ASKs during autonomous operation.
  #
  # `bash` itself is ASK by default (below) — bash_security.py's 26 checks
  # gate destructive commands but say nothing about ordinary write verbs.
  # A carve-out grants AUTO for a config-defined read-only allowlist
  # (`bash_readonly_allowlist` — pytest, git status/log/diff/show,
  # boot-smoke probe) in every mode; `free` relaxes the rest of `bash`
  # through its baseline, for full no-operator autonomy.
  #
  # Kept ASK: `file_write` (path_overrides handle the DENY surfaces but
  # an unmatched path still warrants a prompt), kernel-lockdown adjacent
  # tools (`agent_create` / `agent_promote`, which ask here and follow the
  # mode like every other tool),
  # schedule mutation, destructive session verbs.
  file_write: ask
  web_search: auto
  tavily_search: auto           # read-only web research — relaxed for autonomous research
  tavily_extract: auto          # read-only URL → markdown extraction
  agent_create: ask            # the file decides; auto under free
  agent_promote: ask           # moves an agent .md from draft to active; the file decides
  invoke_agent: auto           # spawns an in-process sub-agent — cheap, operator-visible
  bash: ask                    # read-only checks run without asking, via the allowlist below. `free` acts without asking for the rest.
                               # The shell check list still refuses destructive commands in every mode. In `free` it also runs one of
                               # its prompting checks unasked and refuses the other five outright, because nobody is there to answer.
  delegate_coder: ask          # spawns a coding agent on your machine, with its own permissions
  delegate_auditor: ask        # the same, for review work
  vault_ingest: auto           # writes vault/raw/ and vault/wiki/ — operator-visible vault surface
  schedule_create: ask         # mutates schedule.yaml at runtime — operator-visible
  schedule_list: auto          # read-only enumeration of registered jobs
  schedule_update: ask         # toggles enabled/cadence/model_role; operator-visible
  schedule_run: ask            # fires a job off-schedule; operator-visible
  schedule_remove: ask         # removes a registered job — operator-visible
  breaker_reset: ask           # starts a refused capability trying again now instead of at the end of its wait
  ask_clarification: auto      # agent posts a question to the workspace inbox
  brief_render: auto           # writes one file into the operator's own store and calls
                               # a chain capped by the `roles.yaml` block named for its
                               # manifest entry; operator-initiated
                               # at both call sites. Class floor is ASK.
  brief_read: auto             # read-only return of today's brief body for the voice "read brief" lane
  return_note_read: auto       # read-only join of the growth records since you were last here
  memory_get: auto             # read-only path-scoped read of memory-store/ markdown files
  workspace_read: auto         # read-only read of the assistant's own workspace documents and playbooks
  file_read: auto
  glob: auto
  grep: auto
  log_triage: auto
  system_diagnose: auto
  image_generate: ask          # each image costs money. There is a daily cap, and this is where you approve the spend

  session_list: auto            # Mirror trio lister (interactive sessions)
  memory_promote: auto
  workspace_post: auto
  workspace_reply: auto
  channel_send_document: auto
  channel_send_photo: auto
  channel_send_voice: auto
  channel_send_video: auto
  channel_send_animation: auto
  channel_send_video_note: auto
  transcribe_audio: auto
  channel_react: auto
  channel_send_location: auto
  channel_send_poll: auto
  channel_send_sticker: auto
  channel_history_read: auto
  channel_notify: auto
  chat_initiate: auto
  agent_ask: auto
  delegate_second_opinion: auto
  delegate_agent_controller: auto
  start_controller_session: auto
  session_close: auto
  session_open: auto
  session_result: auto
  session_send: auto
  controller_session_list: auto
  lane_attach: auto
  lane_close: auto
  lane_list: auto
  lane_open: auto
  lane_read: auto
  lane_send: auto
  lane_turn: auto
  lane_status: auto
  lane_named_ensure: auto
  lane_named_get: auto
  lane_named_list: auto
  surface_bind_session: auto
  open: auto
  os_launch: ask
  os_open_url: auto
  project_list: auto
  project_link: ask
  project_open: ask
  project_new: ask
  project_propose: ask        # puts an idea for a new project to you; it creates nothing
  project_budget: ask          # what a day of unattended work on a project may spend
  git: ask                     # commit/checkout/push on a repo outside the seal. `push` needs confirm_push=true in the tool itself, so it holds in `free` too.
  surface_close: auto
  surface_create: auto
  surface_focus: auto
  surface_highlight: auto
  surface_list: auto
  surface_update: auto
  # AUTO for the same reason the rest of the surface verbs are: it acts on
  # a card the operator is looking at, so the result is visible the instant
  # it happens and undone by touching the card itself. It cannot reach
  # outside the canvas.
  surface_control: auto
  browser_navigate: auto
  browser_snapshot: auto
  browser_click: auto
  browser_fill_form: ask
  browser_screenshot: auto
  browser_network_requests: auto
  browser_close: auto
  # The acting verbs split on one question: does the call put data INTO the
  # page. Typing does, and typing is how a password or a card number gets
  # there, so `browser_key` and `browser_select` ASK for the same reason
  # `browser_fill_form` does. Moving a viewport, hovering, waiting and
  # operating a media element cannot commit anything, so they are AUTO.
  browser_key: ask
  browser_select: ask
  browser_media: auto
  browser_scroll: auto
  browser_hover: auto
  browser_wait_for: auto
  # ASK, unlike every browser verb above it. Those photograph a web page the
  # assistant navigated to; this photographs the OPERATOR'S OWN SCREEN and
  # sends it to a vision model that may not be local. That is an outbound
  # call under the standing rule, and the operator is sitting in front of the
  # thing being photographed.
  screen_look: ask
  tool_search: auto
  orb_visibility: auto
  cockpit_show: auto
  work_send: auto
  file_copy: ask
  file_move: ask
  agenda_comment: auto
  skill_create: ask
  skill_promote: ask
  skill_refine: ask
  playbook_judge: ask        # your verdict on a playbook, so it is never the assistant grading its own work
  playbook_record: auto      # reads the usage log, the turn records and the ledger and reports what each playbook has done; writes nothing
  playbook_search: auto      # reads the playbooks already named in the prompt and returns the rest of one; nothing leaves the machine
  atlas_query: auto           # read-only walk over the derived graph; opens atlas.json and returns text
  autonomy_read: auto        # read-only view of the panel's own state; asking what it says costs no more than opening it
  context_read: auto         # the shape of the conversation it is already running in; no message content leaves it
  day_read: auto             # reads the records the runtime keeps of its own turns; nothing leaves the machine
  health_leave: auto         # marks one Health line as seen. The row stays, under Operating, saying so; it comes back if the fault worsens, and one call undoes it
  health_repair: auto        # gathers what is known about one Health row so the assistant can look into it. It changes nothing itself; anything it then does is gated on its own
  workspace_decide: ask       # the gate's prompt is where you approve. A mode baseline reaches this like every ask
  task_propose: ask           # the gate is you accepting the task
  task_work: auto             # takes up a task you already accepted and ties the turn to it; nothing new is decided
  task_close: ask             # the gate is you reading the evidence before a task closes. A project's own checks decide first: a task on a project with verify steps is done only when they pass
  workspace_pending: auto     # reading what is waiting on you decides nothing
  workspace_hold: ask         # decides which of your own documents a change must be asked about. You pressing the switch, or saying so on a channel, is the approval
  credential_list: auto      # names, usernames and purposes of the assistant's own accounts; no tool returns a value
  credential_request: auto   # writes a row asking the operator for an account. The row in Settings IS the gate, like propose_change
  credential_setup: ask      # the agent knows how a service authenticates; the HOSTS it proposes are the one thing an injected instruction must not widen quietly
  context_set: ask         # rewrites roles.yaml and changes how every open conversation folds
  session_continue: ask     # folds this conversation, or leaves it behind and starts fresh. The gate is you
                           # deciding a piece of work is over. Under free the assistant decides that itself,
                           # which is the mode's whole point, and auto-compact is still the backstop either way
  api_request: ask         # sends one of the assistant's own accounts to a service. The hosts were approved
                           # once at setup; this is the outbound call itself, which principle 3 gates
  command_run: ask         # hands every field of one of its own accounts to code it wrote and runs it.
                           # The runtime checks no address for this one, so the approval IS the check
  pipeline_run_stage: ask   # one step of the nightly upkeep, fired by hand. It writes to the memory store,
                            # the indexes or the map, and a step can spend a provider call
  retention_set_window: ask  # how long one of this machine's own logs is kept. Shortening a window is what
                             # deletes the record an investigation would have read
# Tools you or the assistant wrote on your own machine, and what each may do.
#
# Empty here because these names exist only where the tools do. Settings ->
# Tools fills it in as you decide. A tool with no line ASKS, and no security
# mode relaxes one: a tool that wrote itself does not get to say it needs no
# permission.
custom: {}

modes:
  # `max` is the `tools:` block above, unchanged.
  max:
    overrides: {}

  # `free` is stated by exception: `baseline` is what every tool gets, and
  # `overrides` lists the ones that keep asking anyway. Nothing has to be
  # relisted here when a tool is added.
  #
  # The baseline does not reach `path_overrides` below, the checks in
  # `permissions/bash_security.py`, or any tool set to `deny`.
  free:
    baseline: auto
    overrides:
      task_propose: ask
      task_close: ask
      context_set: ask
      playbook_judge: ask
      project_budget: ask

# Path-scoped overrides — evaluated before mode overrides. Matched by prefix
# (forward-slash normalized) against the tool input's path field. First
# match wins, so AUTO allow-paths are listed before DENY source-code paths.
#
# Kernel lockdown: the assistant can READ all source but cannot WRITE it. Source
# edits go through `delegate_coder` / `delegate_auditor` — those CLIs have
# their own approval model and are the operator's escape hatch. DENY here
# is absolute: the operator cannot override with `y` at the prompt.
path_overrides:
  file_write:
    # Prefixes are STATE-ROOT-relative (`<home>/…`), matching the anchor
    # `PermissionPolicy._normalize_for_prefix_match` resolves against. They
    # are not repo-relative: source lives in the sealed `app/` tree, which is
    # outside the write boundary entirely and never reaches this layer.
    #
    # `_path_posture` takes the FIRST matching prefix, not the longest —
    # specific rules must precede the general ones they sit under.

    # ─── ASK — the workshop: the assistant drafts markdown skills
    # (SKILL.md + optional bundled scripts/) here; operator approves the
    # write before it lands. Must win over any broader workspace/ rule. ───
    - path_prefix: workspace/skills/
      posture: ask
      reason: "the assistant drafts skill folders here; operator approves the write"

    # ─── AUTO — the assistant's writable surfaces (specific paths, listed first) ───
    - path_prefix: memory-store/
      posture: auto
      reason: "memory store is the assistant's canonical interior"
    - path_prefix: logs/sessions/
      posture: auto
      reason: "bookkeeping log stream (reflect/session_end/auto_compact/scheduler JSONL)"
    - path_prefix: workshop/
      posture: auto
      reason: "the assistant's working space — task drafts, notes, scratch work (gitignored)"

    # ─── ASK — writing here is writing code the runtime will import and run
    # in-process (`kernel/home_tools.py`). The workshop above is AUTO because
    # a draft there is inert until someone runs it; a file here becomes a
    # callable tool the moment it is searched for, so the write IS the
    # approval to execute it. Stated rather than left to the unmatched-path
    # default, because that default could be widened without anyone noticing
    # this is what it was holding. ───
    - path_prefix: tools/
      posture: ask
      reason: "a file here becomes a tool the runtime imports and runs; the write is the approval"
    - path_prefix: vault/raw/
      posture: auto
      reason: "vault ingestion lands raw files here (when vault_ingest wires up)"

    # ─── DENY — source trees, state-root-relative. Inert in a packaged
    # install (source lives in the sealed `app/` tree, and `<home>/kernel/`
    # does not exist); load-bearing in a DEV checkout, where the state root
    # IS the source package and the write boundary therefore cannot separate
    # them. `file_write::_RUNTIME_LOCK_PREFIXES` enforces the same set
    # absolutely, below policy. ───
    - path_prefix: kernel/
      posture: deny
      reason: "kernel source — edits go through delegate_coder / delegate_auditor"
    - path_prefix: brain/
      posture: deny
      reason: "chat/loop source — edits go through delegate_*"
    - path_prefix: memory/
      posture: deny
      reason: "memory subsystem source (not the memory-store/) — edits go through delegate_*"
    - path_prefix: permissions/
      posture: deny
      reason: "permission engine source — DENY by design"
    - path_prefix: orchestrator/
      posture: deny
      reason: "multi-agent orchestration source — edits go through delegate_*"
    - path_prefix: mirror/
      posture: deny
      reason: "Mirror frontend source — edits go through delegate_*"
    - path_prefix: scheduler/
      posture: deny
      reason: "scheduler source — edits go through delegate_*"
    - path_prefix: supervisor/
      posture: deny
      reason: "supervisor source — edits go through delegate_*"

    # ─── DENY — state the assistant must not rewrite directly. ───
    - path_prefix: agents/
      posture: deny
      reason: "agent .md files are managed via agent_create; loader.py is source"
    - path_prefix: .env
      posture: deny
      reason: "secrets — never writable by the assistant"

    # ─── Config: the two locks that survive, then the rest at ASK. Order is
    # load-bearing — `config/` would shadow both specific rules if it came
    # first, and the assistant could widen its own permissions at ASK. ───
    - path_prefix: config/permissions.yaml
      posture: deny
      reason: "the assistant must not widen its own permissions; operator edits by hand or in Settings"
    - path_prefix: config/mirror.yaml
      posture: deny
      reason: "Mirror server config — operator-owned"
    - path_prefix: config/mcp.yaml
      posture: deny
      reason: "MCP verb postures — the sole authority since the source-side floors were removed; the assistant must not widen its own reach"
    - path_prefix: config/identity.yaml
      posture: deny
      reason: "the assistant's name, gender and wake phrase — it must not rename itself or turn off the phrase it is woken with; Settings -> Identity is the writer"
    - path_prefix: config/
      posture: ask
      reason: "providers/roles/schedule — a delegate may edit, operator approves each write"
    # Anything not matched above falls through to the MODE override, then to
    # `tools.file_write`. That is ASK in the shipped `max` mode, but AUTO in
    # `free` — add the rule; do not rely on the fallthrough.

# ─────────────────────────────────────────────────────────────────────────
# Your own documents, and the one door to them.
#
# These are the files the assistant is given at the start of every turn: its
# voice, what it has learned about you, the rules it works by. There is one way
# for it to change one, and that is to propose the change. The ordinary file
# tools cannot reach them at all.
#
# `proposal` is what happens when it proposes one. On the shipped setting the
# change waits in your workspace for you to approve it. If you switch the app
# to unattended, the change is applied and the same card is filed already
# decided, so you still see everything that happened.
workspace_documents:
  documents:
    - SOUL.md
    - USER.md
    - OPERATING.md
    - WORKSHOP.md
    - DIARY.md
    - CHANNEL.md
  direct_write: deny
  proposal:
    max: ask
    free: auto
    # The documents you keep a hand on, whatever the mode says. A change to
    # one of these always waits for you. Everything not listed follows the
    # mode above. Set them in Settings under About, or say so on any channel.
    overrides:
      OPERATING.md: ask
      WORKSHOP.md: ask
      CHANNEL.md: ask

# ─────────────────────────────────────────────────────────────────────────
# The same statement, for the cards that are not about a document.
#
# A card asks you to decide something. Most name one of the files above and
# are answered by that block; the rest name no file at all, like a memory
# merge or a skill the assistant wants to keep, and had no way to be answered
# by a policy. Same shape, keyed by the kind of card.
#
# `auto` means the runtime approves it itself, through the same path your
# Approve button uses, and files the card as applied with its evidence rather
# than making it vanish. It then tells you. It never means the card is
# skipped. The four below always wait for you whatever the mode says.
workspace_cards:
  proposal:
    max: ask
    free: auto
    overrides:
      # A question the assistant asked YOU: approving it on its own would
      # answer it with nothing.
      clarification: ask
      nudge: ask
      # Config is what says how the app is actually wired.
      yaml_change_proposal: ask
      # You and the refresher edited the same paragraph of a knowledge-base
      # file, so it left the file alone and asked. Approving that on its own
      # would pick one wording over the other with nothing left to read.
      kb_merge_conflict: ask

# ─────────────────────────────────────────────────────────────────────────
# Read-only self-verification allowlist. `PermissionPolicy._bash_readonly_posture`
# matches the `bash` tool's `command` input against these two lists BEFORE
# mode/tools-default resolution, so a match resolves AUTO in every security
# mode — including `max`, where `bash` otherwise defaults to ASK (see
# tools.bash above). Matching rejects any command containing a byte in
# {\n \r & | ; < > ` $ ( ) \} — a byte-set denylist (not substring) so
# single `&`, `<`, bare `$`, and newline smuggling are caught alongside
# piping/chaining/backticks/parens — that could smuggle a write past a
# read-only-looking prefix. It also rejects argv tokens that are
# write-producing flags on the programs themselves (curl -o/-O/--output,
# git --output=, pytest --junitxml/--html/--json-report/--cov-report/
# --basetemp/-o) — these need no shell metacharacter at all, so the
# byte-set check alone would miss them.
#
# Two lists:
#  - bash_readonly_allowlist: prefix entries. Entries ending in "/" are
#    path-scoped (pytest only runs under tesseract/tests/) — the slash is
#    the match boundary, and a ".." in the remainder after the prefix is
#    rejected (traversal), scoped to those entries only so `git log
#    HEAD..main` keeps working via the plain "git log" prefix.
#  - bash_readonly_exact_allowlist: whole-string-only entries — no
#    trailing argument accepted at all, not even a bundled short-flag
#    cluster (`-sO`, `-so<path>`) that the write-flag token check can't
#    see through. The curl health probe needs no arguments to do its job,
#    so both curl forms live here instead of the prefix list. Bare-dir
#    pytest invocations (whole suite, no path suffix) are exact too since
#    the prefix list's "/"-boundary form requires a path segment after it.
#
# This is additive, not a bypass: bash_security.py's 26 numbered checks
# (20 absolute-DENY + 6 forced-ASK) still run first in decide.evaluate and
# are never reachable through this allowlist — e.g. `git show; rm -rf /`
# still hits a forced-ASK check before policy is ever consulted.
# ─────────────────────────────────────────────────────────────────────────
bash_readonly_allowlist:
  - "pytest tesseract/tests/"
  - "python -m pytest tesseract/tests/"
  - "git status"
  - "git log"
  - "git diff"
  - "git show"

bash_readonly_exact_allowlist:
  - "pytest tesseract/tests"
  - "python -m pytest tesseract/tests"
  - "curl http://127.0.0.1:8000/api/health"
  - "curl -s http://127.0.0.1:8000/api/health"

# ─────────────────────────────────────────────────────────────────────────
# The `git` tool's read-only operations, matched by
# `PermissionPolicy._git_readonly_posture` against the call's `operation`
# field before mode/tools-default resolution. Same reads, same answer as the
# bash allowlist above: without this the structured tool prompts where the
# command string does not, and the model learns to reach for `bash` instead,
# which is the drift one git tool exists to prevent.
#
# **Only for THIS project.** The parity holds because `bash` runs with
# `cwd=workspace_root`, so `git log` through that door reads this repository
# and no other. A call naming a `repo` elsewhere on disk prompts, because
# auto-allowing it would be a wider grant than the one it is modelled on.
#
# Everything that writes — add, commit, checkout, init, remote, pull, push —
# is absent here and keeps the tool's ASK default; `push` additionally
# demands `confirm_push=true` inside the tool, in every mode. The verb is a
# closed Literal, which bounds which verb runs and nothing about its
# arguments: `_argv` refuses a `ref` that would turn `show` into a write.
#
# `path_overrides` cannot reach this tool either way. It matches on
# `file_path`/`path`, and `GitInput` carries neither, so a git entry there
# would never fire whatever the resolution order is.
# ─────────────────────────────────────────────────────────────────────────
git_readonly_operations:
  - status
  - log
  - diff
  - show
  - branch

# ─────────────────────────────────────────────────────────────────────────
# Session-turn thresholds. `total_turn_timeout_s` is read by
# `kernel/tools/session_tools.py::_load_session_thresholds` for CLI-backend
# `session_open` turns. The coalescer + reattach knobs are read by
# `mirror/server/config.py::_load_terminal_config`.
# ─────────────────────────────────────────────────────────────────────────
pty_thresholds:
  total_turn_timeout_s: 300                       # cap a single interactive-session turn
  coalesce_flush_ms: 8.0                          # max hold-back for a WS output frame under sustained load
  coalesce_flush_chars: 4096                       # size trigger for an early coalesced flush
  reattach_grace_s: 30                             # keep a detached PTY alive this long for a reconnecting client
  pause_buffer_cap_chars: 2000000                  # force-resume drain once a paused pane's queued output exceeds this

