# Agenda mappers — maps each autonomy event source to how it turns into an
# agenda item (an operator-visible proposal or task).
#
# Each block below is one mapper. Set `enabled: false` to stop a source from
# generating agenda items.
#
# A mapper belongs here only for a source that reports something that
# HAPPENED. A source that merely wants attention writes agenda items nobody
# acts on, which is why there is one mapper here besides the operator's own
# entry point.
#
# A mapper added here needs a producer declared in
# `orchestrator/autonomy/mappers/__init__.py::SOURCE_PRODUCERS`, and boot checks
# that the producer exists and is enabled.

mappers:
  # Fires when the daily provider probe records a role whose primary did not
  # answer — a fact about this machine, not an inference about the operator.
  provider_watch:
    enabled: true
    source: provider_watch
    default_risk_class: propose
    dedupe_window_hours: 168
