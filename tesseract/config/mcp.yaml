# MCP control-plane server.
#
# TESSERACT exposes itself as a local HTTP/SSE MCP server embedded in the
# Mirror backend. Every key below is required — the loader raises on a
# missing or invalid value rather than silently defaulting. Secrets never
# live in this file — only *_env names that point at environment variables.
#
# host/port here are the ADVERTISED endpoint, not a separate network
# listener — the MCP server rides on the Mirror backend's own socket (see
# mirror.yaml server.host/port). Keep these two files in sync.
server:
  # Off until the operator turns it on in Settings → Keys → MCP. Nothing in
  # the app needs this surface — the CLI lanes and the terminal reach the
  # runtime directly — so it exists only for connecting an OUTSIDE tool, and
  # a door that is only sometimes wanted should be shut by default. When
  # false the server is never constructed and /mcp answers that it is off.
  enabled: false
  host: "127.0.0.1"                     # loopback-only; MCP is local-only like the Mirror app
  port: 8000                            # must match mirror.yaml server.port
  token_secret_env: "TESSERACT_MCP_SECRET"   # env var holding the operator client's bearer token
  max_connections: 20                   # cap on simultaneous MCP sessions
  ask_hold_timeout_s: 120               # seconds an ASK-gated verb can hold before degrading to async
  idle_timeout_s: 600                   # idle sessions are swept after this many seconds

# Server→client push on the GET SSE stream (the `activity.watch` subscription).
# These numbers are the memory ceiling of the whole subscription: the shared
# replay log holds `replay_buffer` events, each connected client holds at most
# `client_queue`, and `max_streams_*` bound how many such clients can exist at
# once — without that last pair the ceiling is per-connection, not total. A
# client resuming from a cursor older than the retained window is told it lost
# events rather than handed a partial history.
stream:
  heartbeat_s: 20                       # idle keepalive; also keeps a watch-only session off the idle sweep
  replay_buffer: 500                    # events retained for Last-Event-ID resume
  client_queue: 200                     # per-connection backlog before the slow-consumer drop
  # How many subscriptions may exist at once. server.max_connections gates
  # session CREATION only — without these, one client could hold one session
  # and stack unbounded streams (each with its own client_queue) behind it.
  # A refused open is a 429; the slot is released when the stream ends.
  max_streams_total: 16                 # across every session
  max_streams_per_session: 2            # one live + one reconnect mid-handover

# The client identity. Default-deny: a bearer token that is not this one is
# rejected. trust_tier is a ceiling layered on top of the per-verb posture
# (see trust_tiers/verbs below), and this client's token_env MUST equal
# server.token_secret_env.
#
# ONE of these is a credential the operator handles: `operator`. It is the
# only one Settings shows, the only one an outside tool is ever given, and
# the only one there is any point pasting anywhere.
#
# The three below are the RUNTIME'S OWN and are not credentials anyone
# types. Every process this app spawns is handed exactly one of them and
# stripped of the rest — `cli_utils.py::scope_mcp_token` for a lane,
# `lanes/mcp_provision.py` for a terminal — so a spawned CLI cannot pick up
# the operator bearer and come back in acting as the operator. Ownership on
# the lane surface is keyed on whichever identity the bearer resolves to,
# which is the whole reason there is more than one.
#
# Deleting them simplifies nothing. Both of those call sites fail CLOSED on
# a name they cannot resolve: the lane refuses to spawn and the terminal
# refuses to provision. Tried it — the backend logged
# `mcp_provision: mcp.yaml has no client named 'terminal-manual'` on the
# next boot, which is what this paragraph is here to stop happening twice.
clients:
  - name: "operator"
    token_env: "TESSERACT_MCP_SECRET"
    trust_tier: "operator"
  # Runtime-internal. Issued per spawned process, never pasted by hand.
  - name: "lane-claude"
    token_env: "TESSERACT_MCP_LANE_CLAUDE_TOKEN"
    trust_tier: "trusted"
  - name: "lane-codex"
    token_env: "TESSERACT_MCP_LANE_CODEX_TOKEN"
    trust_tier: "trusted"
  - name: "terminal-manual"
    token_env: "TESSERACT_MCP_TERMINAL_TOKEN"
    trust_tier: "trusted"

# Posture ceiling per client trust tier: operator/trusted clients may act
# autonomously; restricted clients need operator approval for everything.
# A remote client should generally be more restricted than the operator,
# never less.
trust_tiers:
  operator: "auto"
  trusted: "auto"
  restricted: "ask"

# Per-verb posture allowlist (default-deny): a verb missing from this map is
# denied. This file is the sole authority — there are no source-side floors,
# and _KNOWN_VERBS in config/mcp.py is a typo net, not a floor. The posture set
# here is the whole decision, capped only by the client's trust tier above.
# That is why config/mcp.yaml is DENY to the assistant in permissions.yaml: with no
# floor beneath it, a write here would widen its own reach.
verbs:
  activity.list: "auto"
  activity.watch: "auto"
  activity.cancel: "ask"
  memory.search: "auto"
  vault.search: "auto"
  vault.query: "auto"
  memory.save: "ask"
  memory.update: "ask"
  vault.ingest: "auto"
  # The whole lane surface runs unattended (operator's call, 2026-08-03): a
  # relay that stops for approval at every hop is not a relay. What this gives
  # up is real and worth naming — lane.send/lane.turn inject instruction text
  # into a CLI running outside this permission engine, and the ASK prompt was
  # the only brake on that path (no iteration or budget cap reaches it;
  # max_spawn_depth guards nesting, _check_daily_caps is autonomy-only, and
  # the cost ledger does not debit subscription-backed lanes). The turn budget
  # that replaces it belongs to the relay.
  lane.ensure: "auto"
  lane.send: "auto"
  lane.turn: "auto"
  lane.read: "auto"
  lane.close: "auto"
  schedule.create: "ask"
  schedule.update: "ask"
  schedule.run: "ask"
  schedule.remove: "ask"
  # Read-only, and the only way to learn the job ids the four verbs above
  # take as arguments.
  schedule.list: "auto"
  surface.open: "auto"
  surface.spawn: "auto"
  surface.update: "auto"
  surface.focus: "auto"
  surface.close: "auto"
  budget.status: "auto"
  budget.set_cap: "ask"
  budget.pause_source: "ask"
  agent.assign: "ask"
  agent.status: "auto"
  agent.review: "auto"

  # P4 — the shared base. Whoever does the work, the store, the vault and the
  # operator-visible thread all see it. The record and the read-back run
  # unattended: a thread nobody can post to is the thing being fixed. Curation
  # does not — forget deletes, and promote rewrites what the assistant believes.
  workspace.post: "auto"
  workspace.reply: "auto"
  # The read-back half. `read` is the thread a client may already write
  # to; `ask` posts a question card and is only useful because `read`
  # exists to collect the answer.
  workspace.read: "auto"
  workspace.ask: "auto"
  memory.recall: "auto"
  memory.get: "auto"
  memory.promote: "ask"
  memory.forget: "ask"
  diary.append: "auto"
  feedback.propose: "auto"
