# Memory subsystem knobs. All keys required — missing keys raise at
# startup (no silent defaults).

auto_recall:
  # Every operator turn is embedded and the top-k best-matching memories
  # are injected as context before the model call.
  top_k: 5

  # Max characters of a recalled memory's rendered line (title + body,
  # collapsed to one line). Keeps the injected block small; the model can
  # still search/fetch the full record if needed.
  char_cap: 300

  # Minimum relevance for a hit to be injected. Applies ONLY to scores from
  # the cross-encoder reranker, which is the one stage that produces a
  # comparable number; every other stage scores on its own scale and is
  # bounded by `top_k` instead. The reranker's score is its 0-1 relevance
  # multiplied by a 0.85 ceiling and the memory's own confidence, so 0.01
  # rejects what the model judged almost certainly unrelated.
  min_similarity: 0.01

  # Turns shorter than this many words skip retrieval entirely (a one-word
  # "ok" isn't worth a retrieval round-trip).
  min_query_words: 3

  # How many connections are printed beside each recalled memory, and 0 turns
  # them off.
  #
  # The map of how everything connects had been asked a question zero times in
  # 2,387 tool calls over fifteen days, while search was asked 48 times. The
  # tool was never hidden: it is the first thing described to the assistant on
  # every turn. It is scoped to a question people do not ask out loud — a turn
  # arrives as "what do I know about X", not as "how do these two connect" —
  # so what the map knows now arrives with the memories that were already
  # being pushed, instead of waiting to be asked.
  #
  # Beside the hits and never as a block of its own: a second unasked block
  # costs every turn whether or not it earns one, and the memories are already
  # the answer to what the turn is about.
  connections_per_memory: 3

  # A memory that was just injected stays excluded from re-injection for
  # this many subsequent turns, so the same fact doesn't repeat every turn.
  dedup_window_turns: 3

# Which admission rules are on. What each one blocks, and why, is declared in
# `tesseract/memory/capture_policy.py` and shown in the Autonomy panel: this
# file only decides whether a declared rule applies. A matcher never lives
# here, and a key naming no declared rule raises at startup.
#
# `secrets` is locked. It is listed so the set is readable in one place, and
# setting it to false changes nothing.
capture_policy:
  secrets: true
  code_pattern: true
  git_history: true
  ephemeral_task_state: true
  instruction_echo: true
  routine_ack: true
  request_echo: true
  turn_summary: true

  # A rule with a number of its own is written as a mapping instead of a bare
  # true or false: `enabled`, plus that rule's own settings. One entry per
  # rule either way, so a rule's switch and its measurement never drift apart.
  #
  # A MINIMUM, not a cap: a body under this many characters is refused, and
  # nothing limits how long one may be.
  #
  # Measured at both places that read it, on the store it was made settable
  # against. Nothing is under 120 at either: no memory record body, and no
  # daily-note section. So every value from the shipped 80 up to 120 does
  # exactly the same nothing, and the first value that does anything, 150,
  # does the wrong thing: it would stop promoting the two shortest chat
  # digests, which are short because those days were quiet.
  #
  # Left where it is deliberately. The number was never derived, so moving it
  # wants the panel's count beside the rule to show it catching something
  # first.
  trivial_body:
    enabled: true
    min_chars: 80

# Autonomy digest recency filter — applied before ranking so stale items
# don't crowd out what's actually current.
autonomy_digest:
  # Agenda entries older than this many days are excluded from the digest.
  max_age_days: 7

# How far a record may stand from material nobody here wrote, and how much
# that distance costs it in retrieval.
#
# The failure this closes: run for days on a topic, and by day three the
# store is mostly the assistant's restatements of its own restatements.
# They share every entity with their source, so they link densely, and dense
# linkage reads as importance. By day four the answer comes from the
# paraphrase instead of the paper, and every stage along the way reported
# success.
derivation:
  # A record written from records that were themselves written here. 0 is
  # raw material, 1 is a summary of it, 2 is a summary that also read a
  # summary. Past this the write is refused and the chain is named.
  #
  # Two is a judgement, not a reading: nothing recorded depth before this
  # setting existed, so there is no distribution behind it. Once records
  # carry a depth, read the real one and re-set this against it.
  max_depth: 2

  # Multiplied into the merged retrieval score, beside temporal decay and
  # the record's own confidence. Not a filter: a derived record still
  # answers when it is the only thing that matches. It just cannot tie with
  # the thing it was written from.
  #
  # Also asserted rather than measured. Where `recalled` belongs against
  # `derived` is genuinely open, and the values here only preserve the
  # ordering the work-history block already rendered.
  tier_weights:
    source: 1.0
    derived: 0.85
    recalled: 0.7
