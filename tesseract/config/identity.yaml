# the assistant's identity anchor facts. Loaded fresh on every prompt build — no
# restart needed after an edit.

# Instance birth timestamp, ISO-8601 with a UTC offset (e.g.
# "2026-01-01T00:00:00+00:00"). Used to compute a "day N" age line in the
# prompt's temporal context. Left blank on a fresh install — the assistant runs fine
# without it (the age line is simply omitted); set it once, whenever you
# like, and it sticks.
born_at: ""

# Where this assistant is documented in public, for the case where it needs to
# hand a person a link rather than explain from memory.
#
# NOT where it reads from. The same Guide ships inside the app (`Guide/`,
# readable with `file_read`) and that copy is the one to read: it is replaced
# wholesale by every update, so it describes the version actually running,
# where the site describes whatever was last published. Read locally, share the
# link.
documentation:
  site: "https://tesseract.metaengineershub.com"

time_of_day_buckets:
  morning:   { start: "05:00", end: "12:00" }
  afternoon: { start: "12:00", end: "17:00" }
  evening:   { start: "17:00", end: "21:00" }
  night:     { start: "21:00", end: "05:00" }
