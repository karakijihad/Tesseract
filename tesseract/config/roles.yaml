# Role Wiring
#
# Roles point at provider model IDs from `providers.yaml`. No connection
# settings, no pricing — those live in the catalog. Reference shape:
#
#   <tier>.<provider>.<model_id>     (e.g. api.openai.gpt54_mini)
#
# A role names its chain one of two ways, never both: `primary` (plus an
# optional ordered `fallbacks` list), or `chain: <name>` resolved against the
# `chains:` block below. Fallbacks are tried in order via FallbackAdapter when
# the prior entry fails (network error, 5xx, rate limit), and mid-turn failover
# is automatic. To swap a model: edit `primary`, or the chain if the role
# follows one. The Mirror config watcher detects the change and calls
# `boot.rebuild_adapters` — no restart.
#
# Fresh-install defaults split across two keys, both listed in `.env.example`:
#
#   OPENAI_API_KEY   — `chat_brain`, the conversational layer. Required to
#                      hold a conversation at all.
#   BUILD_NVIDIA_KEY — every background role (observer, sub-agents, autonomy,
#                      image generation). NVIDIA's build tier is free, so this
#                      keeps unattended work off your paid key. Omit it and
#                      those roles fall through to their OpenAI fallback,
#                      which works but bills you.
#
# Voice (`stt`, `tts`, `audio_transcribe`) and `embeddings` run locally and
# need no key at all. Add any other key from `.env.example` and its matching
# catalog entries become usable fallbacks automatically — nothing else to
# configure.

# ─── Embeddings ─────────────────────────────────────────────
# Local-only by contract — per-turn retrieval can't afford a network
# round-trip for 768-dim vectors, and the catalog has no cloud embedding
# model, so no API key substitutes for this one. First-run setup installs
# Ollama and pulls `nomic-embed-text` for you; if that fails (offline
# install), retrieval degrades to BM25 keyword matching rather than
# crashing, and re-running setup repairs it.
embeddings:
  primary: local.ollama.nomic_embed

# --- Reranker -----------------------------------------------
# Cross-encoder precision stage after BM25+vector RRF fusion, CPU-only.
# Best-effort by contract: absent model files degrade retrieval to pure
# RRF order. Fetch: python -m tesseract.scripts.fetch_reranker_model
reranker:
  primary: local.onnx_reranker.msmarco_minilm_l6

# ─── Shared chains ──────────────────────────────────────────
# A chain written once and named by many roles. `chain: <name>` on a role
# replaces its `primary` + `fallbacks`: the first ref is the primary, the
# rest are the fallbacks in order. Swapping a provider for every role on a
# chain is then one edit here instead of one per role — which is the whole
# point, so a role may not set `chain` AND its own primary/fallbacks. Pick
# one; the loader refuses both and says so.
#
# A role is not obliged to use these. Anything with a reason of its own to
# sit on a particular model writes its refs out — chat_brain, the CLI roles,
# the delegation seats, image_generator and audio_transcribe all do.
#
# Naming: numbered on purpose. Any descriptive name — for the providers on
# it, or for what it costs — is a claim that expires the moment you point the
# chain somewhere else, and pointing it somewhere else is the reason it
# exists. A number cannot go stale. What a chain is for is decided by the
# roles that name it, and those you can read.
#
# Selecting a model in Settings edits ONE role, so the first such edit
# rewrites that role's refs in place and drops its `chain:` key. The other
# roles on the chain do not move.
chains:
  chain_1:
    - api.nim.gpt_oss_120b
    - api.google.gemini_36_flash
    - api.openai.gpt56_luna
  chain_2:
    - api.google.gemini_36_flash
    - api.nim.gpt_oss_120b
    - api.openai.gpt56_luna
  chain_3:
    - api.openai.gpt56_luna
    - api.openai.gpt54_mini
    - api.xai.grok_43
  chain_4:
    - cli.claude.opus_5
  chain_5:
    - cli.codex.gpt56_terra
  chain_6:
    - api.google.gemini_31_flash_image
    - api.xai.grok_imagine_image
  chain_7:
    - local.whisper.local_whisper
roles:

  chat_brain:
    mode: active
    # Fresh-install default: GPT-5.6 luna — cheap ($0.2/$1.2 per Mtok),
    # 400K context, vision and PDF input, and reliable tool-calling. The
    # first fallback is the same key (gpt-5.4-mini), so a rate limit or
    # transient error still resolves on OPENAI_API_KEY alone. The Grok
    # fallback only activates once XAI_API_KEY is added to .env.
    chain: chain_3
    compact_threshold: 0.7        # compact when history >= 70% of context_window (raised from 0.4 — we have the room)
    keep_recent_turns: 10         # legacy fallback; ignored when active_window_tokens is set
    head_anchor_messages: 3       # first N user messages preserved verbatim across every compaction (attention-sink anchor)
    active_window_tokens: 60000   # token-budgeted verbatim tail. MUST stay well below the SMALLEST
                                  # context_window*compact_threshold in the chain — here the two
                                  # OpenAI entries' 400000*0.7 = 280k — or compaction can never
                                  # shrink history below the trigger and re-runs (wasting a
                                  # reflection call) every turn. Re-check this bound when swapping
                                  # in a model with a smaller context window.
    summary_char_budget: 16000     # cap on the [Context from earlier...] block; oldest slice drops first when over
    tool_iteration_cap: 80    # hard cap on tool-call iterations per turn (runaway-loop guard)
    consecutive_error_cap: 3  # adapter ERRORs in a row before the chat_brain circuit-breaker trips and surfaces a final ERROR
    daily_budget_usd: 3.0     # role-level cap (in addition to global cap derived from sum of inner caps)
    notes: >-
      the assistant conversational layer. The primary is vision-capable, so image
      turns ride it directly; `find_vision_entry` still walks the chain if the
      primary loses vision on a future swap, and `vision_agent` remains the
      focused-pass delegate.

  observer_agent:
    mode: active
    chain: chain_1
    reasoning_effort_override: low    # observer doesn't need multi-step planning
    max_output_tokens_override: 2048  # gemini fallback burns output tokens on internal thinking — 2048 leaves headroom for the ~200-token JSON envelope
    daily_budget_usd: 1.0
    notes: >-
      Peripheral observer — stateful background subscriber + one-shot observe
      pass share this role. Emits memory_suggestion envelopes.

  # ─── The CLIs themselves ────────────────────────────────────
  # WHICH MODEL each CLI runs. Distinct from the delegation seats below, and
  # both are needed: these names are also the worker-registry kinds, the
  # cost-ledger role keys, the `mirror.yaml` subscription-parallelism keys and
  # the `agenda.yaml` timeout keys. A seat says who does a job; these say what
  # a CLI is.
  claude_cli:
    mode: active
    chain: chain_4
    notes: >-
      The claude CLI. Driven via PTY or --output-format stream-json. Rides
      your Claude Code subscription login — no API key needed, but the CLI must be
      installed and logged in.

  codex_cli:
    mode: active
    chain: chain_5
    notes: >-
      The codex CLI. `codex exec` for one-shot, PTY for multi-turn. Rides your
      Codex CLI subscription login — no API key needed, but the CLI must be installed
      and logged in.

  # ─── Delegation seats ───────────────────────────────────────
  # A seat is a JOB, not a vendor. Each names the CLI that fills it by
  # default; the provider is read off the ref rather than hardcoded, so
  # re-seating is a yaml edit — point `auditor` at a claude ref and claude
  # reviews. A single call may borrow the other CLI with `provider:`, whose
  # model then comes from that CLI's own role above.
  #
  # A seat may name a `cli.*` ref (a CLI subprocess lane) or an `api.*` ref (a
  # tool-less model lane). Both have a lane adapter, so moving a seat between
  # them is a yaml edit and nothing else. Any other tier is refused at
  # resolution rather than failing later as a transport error.
  #
  # An api seat has NO TOOLS — it cannot read files or run commands, so it is
  # read-only by construction rather than by a flag. It reviews what the brief
  # hands it: a real auditor, a poor coder.
  # No `daily_budget_usd` on the two seats below, and that is the correct
  # encoding rather than an omission. Both ride a `cli.` tier — a subscription,
  # free at use-time — so there is nothing to meter.
  #
  # Do NOT write `daily_budget_usd: 0.00` here to say so. It reads as "free
  # lane" beside `local.kokoro.af_heart: 0.00` further down this same file and
  # means the opposite: a voice lane's figure becomes `VoiceRate.cap_usd` and
  # only feeds the global sum, while a role's becomes `per_role_caps[role]`, and
  # `budget_state` computes `role_blocked = role_spent >= role_cap`. `0.0 >=
  # 0.0` is True, so the seat would be blocked before its first call of the day.
  # An absent key skips `per_role_caps` entirely and adds nothing to the sum,
  # which is exactly what is wanted. The same trap waits for every future
  # `cli.` seat.
  coder:
    mode: active
    chain: chain_4
    notes: >-
      Delegation seat — writes code. Large reads, multi-file refactors.
      Backs `delegate_coder`.

  auditor:
    mode: active
    chain: chain_5
    notes: >-
      Delegation seat — reviews, verifies, second opinions. Never edits.
      Backs `delegate_auditor`.

  agents_default:
    mode: active
    chain: chain_2
    daily_budget_usd: 1.00
    notes: >-
      Default model for sub-agents that don't pin one in agents/INDEX.md. Cheapest
      viable fit — agents that need more horsepower set their own.

  channel_vision:
    mode: active
    chain: chain_2
    daily_budget_usd: 1.00
    notes: >-
      Image understanding — a photograph the operator sent through a channel,
      and `screen_look`'s frame of their own screen. Not a chat seat: the
      handler resolves a vision-capable entry from the chat_brain chain and
      bills HERE, so this entry exists to give that spend a cap of its own.
      Without it the role had no per-role cap at all and only the global one
      applied, which meant a vision call could not be limited without limiting
      everything.

  subagents_default:
    mode: active
    chain: chain_2
    daily_budget_usd: 0.50
    notes: "Default model for sub-sub-agents (delegates spawned by agents)."

  watchman:
    mode: active
    chain: chain_1
    daily_budget_usd: 0.50
    notes: >-
      Hourly runtime report. Counts what went wrong in `runtime/logs/` and the
      worker records, then writes one paragraph from those counted facts — a
      figure it invents is dropped rather than published. A quiet window calls no
      model at all, which is what keeps this cap ample.

  # ─── Delegation roles ───────────────────────────────────────
  image_generator:
    mode: active
    chain: chain_6
    daily_budget_usd: 1.00
    notes: >-
      Both entries do text-to-image AND image-to-image, so the chain degrades on
      availability rather than on capability. Gemini 3.1 Flash Image leads on prompt
      adherence and legible in-image text; Grok Imagine sits behind it at roughly a
      third the price. Primary rides GOOGLE_API_KEY, which the gemini cognition roles
      already require, so image generation needs no additional key on a default
      install — but it is PAID either way: there is no free image lane in the catalog
      since the NIM FLUX entries were retired. Set XAI_API_KEY to arm the fallback.

  audio_transcribe:
    mode: active
    chain: chain_7
    notes: >-
      Audio-to-text. WS preprocessor calls local_whisper.transcribe directly
      (engine preloaded at boot). The `transcribe_audio` tool is also registered for
      ad-hoc re-transcription from chat_brain. Runs on CPU with no extra setup; see
      providers.yaml's whisper comment to opt into a CUDA GPU checkpoint.

# ─── Voice subsystem ────────────────────────────────────────
# Style/character is config-only via per-surface `synthesis_presets` on each
# TTS provider (intent / answer). Mood drives the orb only; it auto-decays
# to neutral at the end of every turn so it can't drift.
voice:
  # No global voice id — a voice is named by its catalog entry, whatever
  # form that entry takes for the provider behind it.
  #
  # What ships by default is local: local TTS and local STT, so a fresh
  # install talks and listens with no key and no bill. That is a default,
  # not a constraint — a lane is whatever refs you name below, so adding
  # a provider to `providers.yaml` and pointing a lane at it is the whole
  # integration.
  #
  # No tool changes how the voice sounds at runtime: the ref IS the
  # voice. When every lane in a chain fails, the reply degrades to text.

  # Each lane (stt / tts) follows the same primary+fallbacks shape as
  # the chat-brain roles. `primary` and entries in `fallbacks` are
  # catalog refs (<tier>.<provider>.<model>) — swap them in Settings →
  # Models or by editing this file. Per-ref overrides live under
  # `settings:`, keyed by the same catalog ref.
  stt:
    mode: active
    primary: local.whisper.local_whisper
    fallbacks:
      - api.google.gemini_flash_audio
    settings:
      local.whisper.local_whisper:
        # Blank means auto-detect, which runs a fixed 30-second detection
        # pass on every call however short the clip is — on CPU that pass
        # can be most of the transcription time. Pinning the language skips
        # it. Blank it to transcribe other languages and pay the pass back.
        language: en
        daily_budget_usd: 0.00
      api.google.gemini_flash_audio:
        # Short transcribe instruction. The model receives it as the first
        # content part and the audio as the second. Verbose prompts pay
        # output-token tax for the same transcript.
        prompt: >-
          Transcribe this audio verbatim. Return only the transcript text —
          no preamble, no labels, no timestamps.
        timeout_seconds: 30
        daily_budget_usd: 1.00

  tts:
    mode: active
    # The primary ref names the voice — any `kind: tts` entry in the
    # catalog is selectable here. Kokoro leads: it is local, so it is free
    # and it starts speaking in about a third of a second once its model
    # is on disk.
    #
    # The cloud lane sits behind it for the case no local model is on disk
    # at all — an install that declined the download, or a machine with no
    # room for it. Without it, declining the local voice means no voice at
    # all.
    #
    # The cloud lane needs GOOGLE_API_KEY. Without one it fails at the
    # first sentence and the lane latches off, which is the same shape as
    # the STT chain below and is what the setup form warns about when the
    # cloud voice is chosen.
    primary: local.kokoro.af_heart
    fallbacks:
      - api.google.erinome
    settings:
      local.kokoro.af_heart:
        # Kokoro loads one 311 MB ONNX session; the timeout is the
        # warm-up cap, not a per-sentence one.
        timeout_seconds: 60
        daily_budget_usd: 0.00
      api.google.erinome:
        # Streamed, so the timeout covers the whole utterance rather than
        # the wait for it to begin. Generous enough for a long reply on a
        # slow connection; a lane that times out mid-sentence latches off
        # and the turn degrades to text.
        timeout_seconds: 60
        # The first paid voice lane, so the first one where this number
        # does work. At $2.304/hour of speech, $1.00 is roughly 26 minutes
        # of talking in a day — well past ordinary use, and it stops a
        # runaway loop from spending the chat budget on saying things.
        daily_budget_usd: 1.00
