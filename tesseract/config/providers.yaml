  kokoro:
    enabled: true
    adapter: kokoro         # tesseract/voice/providers/kokoro_tts.py
    timeout_seconds: 60     # warm-up cap; per-ref override in roles.yaml::voice.tts.settings
    max_retries: 1
    host: this_pc
    # The pin sits on the connection, not on each voice, because every
    # Kokoro voice below is a `mix` over these same two files rather than a
    # download of its own. Pinned to a release tag, never `latest`; each
    # file is verified against its sha256 before it is installed. Fetch:
    #   python -m tesseract.scripts.fetch_kokoro_voice
    download:
      max_download_mb: 512
      # What the transfer actually costs, in the decimal megabytes the setup
      # form quotes. Distinct from `max_download_mb` beside it, which is a
      # REFUSAL CAP and always the larger number — quoting that to an operator
      # would say a 354 MB download is 512 MB. Measured from the pinned URLs
      # below rather than estimated, and it is the same bytes on every machine,
      # which is the only kind of figure that may be shown to someone else's
      # install.
      download_mb: 354
      base_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
      files:
        kokoro-v1.0.onnx: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
        voices-v1.0.bin: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    models:
      # One 311 MB ONNX model holds every voice; a voice is a small style
      # embedding inside `voices-v1.0.bin`. So each entry below is not a
      # separate download — it is a `mix` over the same two files, fetched
      # once from the `download:` pin above.
      #
      # `mix` is voice_id -> weight. Give it two or more weights and the
      # style embeddings blend linearly — that is how a custom timbre is
      # designed. `kokoro.get_voices()` lists all 54 ids.
      #
      # `speed` is Kokoro's only pacing knob: 1.05 is quicker, 0.95 is
      # slower. The intent/answer split is the same one every lane keeps —
      # intent acknowledges, answer speaks — so switching lanes changes the
      # timbre and not the delivery.
      #
      # `device: cuda` is safe on a CPU-only machine — onnxruntime falls
      # back to CPUExecutionProvider and logs the downgrade.
      kokoro_v1:
        kind: tts
        model: kokoro-v1.0.onnx
        voices_file: voices-v1.0.bin
        lang: en-us
        device: cuda
        sample_rate: 24000
        synthesis_presets:
          intent:
            speed: 1.05
            sentence_silence: 0.2
          answer:
            speed: 1.0
            sentence_silence: 0.2
        cost_per_million_chars: 0.00
        # Refs stay `local.kokoro.<voice>` — the block above is shared
        # settings, not an entry of its own.
        voices:
          af_heart:
            label: "Heart — US female"
            gender: female
            mix:
              af_heart: 1.0
          am_echo:
            label: "Echo — US male"
            gender: male
            mix:
              am_echo: 1.0
        good_for:
          - tts
