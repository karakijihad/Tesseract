# Providers Catalog
#
# Pure data: connection settings, named model entries, pricing. No role wiring
# lives here — see `roles.yaml` for which model serves which slot. References
# from `roles.yaml` and `agents/INDEX.md` use the shape:
#
#   <tier>.<provider>.<model_id>
#
# e.g. `api.openai.gpt54_mini`, `cli.claude.opus_47`, `local.ollama.nomic_embed`.
#
# What a provider entry is: a connection block (base_url, timeout, retries,
# adapter) plus a `models` map of named model entries (pricing, context
# window, capabilities). `api_key_env` names an environment variable you
# supply in your `.env` file — see `tesseract/.env.example`. Providers under
# the `local` and `cli` tiers need no API key at all: `local` runs on your
# own machine (Ollama, Whisper, Piper), and `cli` rides your existing Claude
# Code / Codex CLI subscription login instead of a per-token key.
#
# Hard rule (CLAUDE.md): edit infrastructure values here, never in code.
# Missing keys raise loudly. No `get(..., "default")` patterns in adapter code.

# ─── Circuit-breaker threshold ──────────────────────────────
# Consulted by `tesseract/context/circuit_breaker.py::_default_max_failures`.
# Observer + scheduler breakers read the same value.
availability:
  max_consecutive_failures: 3

# ─── Fallback chain policy ──────────────────────────────────
# Consumed by `tesseract/brain/adapter_chain.py::FallbackAdapter`.
#
# The chain advances to the next entry on HARD errors (auth, model
# not found, billing, malformed request, context overflow). On
# TRANSIENT errors (429/5xx/timeout/network) the chain retries the
# *same* entry up to `transient_retries` times with exponential
# backoff (`transient_backoff_ms` doubling each retry) before
# advancing. UNKNOWN errors (adapter did not classify) are treated
# as TRANSIENT — retry first.
#
# Per-provider SDK retries (`max_retries` on each connection block)
# operate at the HTTP layer and run BEFORE these chain-level retries.
# Compaction (`tesseract/brain/compaction.py`) bypasses this chain
# entirely and uses only the primary; see plan 1-setsate.
#
# Per-provider override: any provider block below may set its own
# `transient_retries` / `transient_backoff_ms` / `cooldown_max_failures` /
# `cooldown_seconds` to diverge from the global. Tune when the failure
# shape differs — e.g. set `transient_retries: 0` on a provider whose
# outages typically last minutes (so the chain falls over instantly),
# or raise `cooldown_seconds` for a provider whose outages are unusually
# long.
#
# Cooldown breaker (per chain entry):
# When an entry advances `cooldown_max_failures` times in a row (HARD
# error or transient retries exhausted), the chain skips it for
# `cooldown_seconds` and walks to the next entry instead. After the
# cooldown elapses the entry is tried again on the next turn; success
# closes the breaker, failure restarts the cooldown. If every entry is
# in cooldown the chain emits a clear "all entries cooling down" error
# (the assistant retries on the next turn). Disable by setting either knob ≤ 0.
chain:
  transient_retries: 2          # retries per chain entry on transient errors
  transient_backoff_ms: 250     # initial; doubles each retry
  cooldown_max_failures: 1      # advance this many times in a row → open the breaker
  cooldown_seconds: 60          # skip the entry for this long before trying again

# ─── Cost tracking (global knobs) ───────────────────────────
# Per-role caps live in `roles.yaml` under `roles.<role>.daily_budget_usd`.
# Per-voice-lane caps live in `roles.yaml` under `voice.{stt,tts}.<lane>.daily_budget_usd`.
# Unit pricing (cost_per_mtok_*, cost_per_million_chars, cost_per_audio_hour)
# lives on the per-model entries below. Single source of pricing truth.
cost_tracking:
  enabled: true
  warning_at_pct: 0.75    # one-shot warning toast at spent >= pct*cap, per scope
  log_file: "logs/cost-tracking.jsonl"

# ─── API tier ───────────────────────────────────────────────
# Pay-per-token providers. Each needs the `.env` key named by its
# `api_key_env` before it can serve a role — an entry with no key configured
# is skipped by the fallback chain (treated as unreachable), never crashes.
# `enabled` switches: tier-level (api.enabled) gates ALL api providers; per-provider
# `enabled` gates that provider only. Disabled refs are skipped during fallback
# (treated as "unreachable") and raise loudly when no chain entry resolves —
# `RuntimeError("no available <role> providers ...")`. Hot-reloaded by the
# config watcher. Reserved key — not a provider name.
api:
  enabled: true
  openai:
    enabled: true
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60
    max_retries: 3
    adapter: openai     # tesseract/kernel/adapters/openai.py
    supports_prompt_cache_key: true   # genuine OpenAI; NIM/compat providers reuse this adapter but 400 on the param
    models:
      gpt54_mini:
        model: gpt-5.4-mini
        context_window: 400000
        max_output_tokens: 8192
        reasoning_effort: high
        temperature: 1.0  # GPT-5 family only accepts default
        knowledge_cutoff: "2024-05-31"
        use_responses_api: true   # GPT-5 family — Responses API path (prompt cache + reasoning reuse)
        cost_per_mtok_in: 0.75
        cost_per_mtok_out: 4.50
        # Native modalities — see Docs/Plan/multimodal/ for routing rules.
        # audio_input/output flagged false: Realtime API path is not wired
        # in the OpenAI adapter; we route audio through whisper STT + TTS roles.
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: true
          image_output: false
          audio_output: false
      gpt56_luna:
        model: gpt-5.6-luna
        context_window: 400000
        max_output_tokens: 8192
        reasoning_effort: high
        temperature: 1.0
        use_responses_api: true
        cost_per_mtok_in: 0.2
        cost_per_mtok_out: 1.2
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: true
          image_output: false
          audio_output: false
  google:
    enabled: true
    api_key_env: GOOGLE_API_KEY
    timeout_seconds: 60
    max_retries: 3
    adapter: gemini     # tesseract/kernel/adapters/gemini.py
    models:
      gemini_36_flash:
        model: gemini-3.6-flash
        context_window: 1048576
        max_output_tokens: 8192
        temperature: 0.7
        use_responses_api: false  # Gemini — no Responses API
        cost_per_mtok_in: 1.50
        cost_per_mtok_out: 7.50
        cost_per_mtok_cached_in: 0.15    # cache reads are 10% of base input
        # No `knowledge_cutoff`: Google does not publish one for this model
        # and the field is optional. An invented date is worse than an absent
        # one — prompt builders read it and would state it as fact.
        #
        # Limits and defaults are the API's own (`GET /v1beta/models/
        # gemini-3.6-flash`): 1048576 in / 65536 out, default temperature 1,
        # max 2, and `thinking: true` — it reasons before answering, so a
        # role wanting a short JSON envelope should still leave output room
        # for the thinking that precedes it. 8192 matches the sibling entries.
        capabilities:
          vision_input: true
          audio_input: true
          video_input: true
          pdf_input: true
          image_output: false
          audio_output: false
      # Image generation — "Nano Banana 2". Separate REST surface from the
      # chat entries above: the Interactions API (`POST /v1beta/interactions`,
      # GA and the documented path for this model family), NOT the chat
      # `:generateContent` one. Auth is the `x-goog-api-key` header rather
      # than a bearer token; `payload_profile: gemini_images` carries both
      # that and the body/response shape in `image_generate.py`.
      #
      # Request:  {"model", "input":[{"type":"text","text":…}
      #            (+ {"type":"image","mime_type","data": <b64>} for i2i)]}
      # Response: {"steps":[{"type":"thought",…},
      #            {"type":"model_output","content":[
      #              {"type":"image","data": <b64>,"mime_type":"image/jpeg"}]}]}
      #
      # The thought step carries a very large `signature` blob that is NOT an
      # image — the extractor keys on `content[].type == "image"` for exactly
      # that reason. Both ops verified live 2026-08-10.
      gemini_31_flash_image:
        kind: image_generation
        model: gemini-3.1-flash-image
        base_url_override: https://generativelanguage.googleapis.com/v1beta/interactions
        payload_profile: gemini_images
        # Output images bill as tokens ($60/Mtok), not flat per image: 1120
        # tokens at 1K ≈ $0.067, rising to ~$0.151 at 4K. This entry generates
        # at the default size, so the 1K figure is the honest one for the
        # ledger. Text input ($0.50/Mtok) is rounding error beside it.
        cost_per_image: 0.067
        capabilities:
          text_to_image: true
          image_to_image: true
      gemini_flash_audio:         # voice STT — the only cloud voice lane left
        kind: audio_stt
        model: gemini-2.5-flash
        cost_per_audio_hour: 0.09  # 25 audio tokens/sec at $1/Mtok

  anthropic:
    # Enabled but not wired: no role names an anthropic ref by default.
    # A fresh install talks through `api.openai.*` (chat_brain) and
    # `api.nim.*` (background roles) — see roles.yaml. Add
    # ANTHROPIC_API_KEY and repoint a role to use these entries.
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 60
    max_retries: 3
    adapter: anthropic  # tesseract/kernel/adapters/anthropic.py
    models:
      opus_5:
        model: claude-opus-5
        context_window: 1000000
        max_output_tokens: 16384
        # No temperature/top_p/top_k — see the cli.claude entry below.
        cost_per_mtok_in: 15.00
        cost_per_mtok_out: 75.00
        # Anthropic accepts text + images + native PDF on every Claude 4.x
        # family member. No native audio/video; route those through whisper STT.
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: true
          image_output: false
          audio_output: false
      sonnet_5:
        model: claude-sonnet-5
        context_window: 200000
        max_output_tokens: 16384
        temperature: 0.7
        cost_per_mtok_in: 3.00
        cost_per_mtok_out: 15.00
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: true
          image_output: false
          audio_output: false
  xai:
    enabled: true
    base_url: "${XAI_BASE_URL:-https://api.x.ai/v1}"
    api_key_env: XAI_API_KEY
    timeout_seconds: 60
    max_retries: 3
    adapter: openai
    # xAI's prompt cache is automatic but node-local — without this routing
    # header same-prefix requests scatter across servers and rarely hit.
    # docs.x.ai/developers/advanced-api-usage/prompt-caching/maximizing-cache-hits
    cache_routing_header: x-grok-conv-id
    models:
      grok_43:
        model: grok-4.3
        context_window: 1000000
        max_output_tokens: 8192
        temperature: 0.7
        # Empty string suppresses the reasoning_effort param entirely — the
        # openai adapter only sends it when truthy (openai.py:150). grok-4.3
        # reasons by default; the xAI OpenAI-compat surface may 400 on the
        # knob, so leave "" (default reasoning) on all compat providers.
        reasoning_effort: ""
        use_responses_api: false   # chat-completions only; Responses API is OpenAI-exclusive
        # Standard <200k-token rate. xAI doubles to 2.50/5.00 above 200k
        # tokens/request; the cost ledger uses this flat estimate.
        cost_per_mtok_in: 1.25
        cost_per_mtok_out: 2.50
        # xAI auto-caches repeated prefixes (no param needed); cached input
        # bills at a fraction of the base rate. Explicit so the ledger
        # doesn't fall back to a default estimate. The openai adapter
        # already captures cached_tokens.
        cost_per_mtok_cached_in: 0.20
        # Multimodal INPUT per the 4.3 model card: text + image (jpg/png,
        # base64, 256-1792 tok/image) + video. Output is text-only — image
        # generation lives on the grok-imagine entries below.
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: false
          image_output: false
          audio_output: false
      # Grok Imagine — image generation. Both t2i and i2i. OpenAI-images
      # REST contract, distinct from the Gemini one above: text-to-image hits
      # /v1/images/generations, image-to-image hits /v1/images/edits (source
      # image as a base64 data URI). The image_generate tool selects the
      # endpoint by op via `payload_profile: xai_images`. Flat per-image
      # pricing. `image_to_image` capability gates the fallback chain.
      grok_imagine_image:
        kind: image_generation
        model: grok-imagine-image
        base_url_override: https://api.x.ai/v1/images/generations
        payload_profile: xai_images
        cost_per_image: 0.02    # flat per docs.x.ai/developers/pricing
        capabilities:
          text_to_image: true
          image_to_image: true

  # NVIDIA build tier — OpenAI-compatible, free with no payment method.
  # Every background role defaults here so unattended work stays off the
  # paid chat key.
  nim:
    enabled: true
    base_url: "${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}"
    api_key_env: BUILD_NVIDIA_KEY
    timeout_seconds: 120
    max_retries: 2
    adapter: openai
    models:
      gpt_oss_120b:
        model: openai/gpt-oss-120b
        context_window: 128000
        max_output_tokens: 8192
        reasoning_effort: high  # REQUIRED by NIM — it 400s when the key is absent.
        temperature: 0.7
        top_p: 0.95
        cost_per_mtok_in: 0.00
        cost_per_mtok_out: 0.00
        capabilities:
          vision_input: false
          audio_input: false
          video_input: false
          pdf_input: false
          image_output: false
          audio_output: false

# ─── CLI tier (subscription — free at use-time) ─────────────
# Rides your existing Claude Code / Codex CLI login — no API key, no
# `api_key_env` here at all. `enabled` switches gate the delegate_* tools
# (and any role that resolves to a cli ref). Disabled tier or provider →
# tool returns "<provider> CLI disabled in providers.yaml" instead of
# spawning the subprocess. Requires the corresponding CLI to be installed
# and logged in on this machine.
cli:
  enabled: true
  claude:
    enabled: true
    command: claude
    timeout_seconds: 300
    max_retries: 1
    stream_json_capable: true
    adapter: cli
    # Subscription auth probe — required on every cli provider, no
    # assumed-authenticated default. Raw probe output is discarded, never
    # logged or stored (it can carry account email/org details).
    auth_check:
      command: [claude, auth, status]
      success_pattern: '"loggedIn"\s*:\s*true'
      login_hint: claude auth login
      # Measured 11.5s on a healthy loop, so a 10s budget reports a logged-in
      # CLI as "auth probe timed out". The probe is a scheduled warm-up, not on
      # the boot critical path, so the headroom costs nothing.
      timeout_seconds: 30
    models:
      opus_5:
        model: claude-opus-5
        reasoning_effort: high
        context_window: 1000000
        max_output_ratio: 0.35
        # No temperature/top_p/top_k: this generation removed the sampling
        # parameters and rejects them with a 400. Harmless while the CLI
        # adapter drops them, fatal the moment an API-backed adapter reads
        # this same entry.
        cost_per_mtok_in: 0
        cost_per_mtok_out: 0
        # Underlying model supports vision/PDF, but the claude CLI's
        # `--file file_id:path` form requires Anthropic Files API IDs
        # (uploads need an API key, defeating subscription-only auth).
        # Until Anthropic adds a `--image-file <local>` flag, vision is
        # effectively unavailable through this adapter — leave false.
        capabilities:
          vision_input: false
          audio_input: false
          video_input: false
          pdf_input: false
          image_output: false
          audio_output: false

  codex:
    enabled: true
    command: codex
    timeout_seconds: 300
    max_retries: 1
    stream_json_capable: true
    adapter: cli
    auth_check:
      command: [codex, login, status]
      success_pattern: 'Logged in'
      login_hint: codex login
      timeout_seconds: 10
    models:
      gpt56_terra:
        model: gpt-5.6-terra
        reasoning_effort: high
        context_window: 200000
        max_output_ratio: 0.5
        max_output_tokens: 100000
        temperature: 0.7
        cost_per_mtok_in: 0
        cost_per_mtok_out: 0
        # codex CLI accepts local images via `-i FILE`. The CLIAdapter
        # extracts image content blocks from the messages list, writes
        # each to a temp file, and emits `-i FILE` argv pairs. Audio,
        # video, and image generation are not exposed by the codex CLI.
        capabilities:
          vision_input: true
          audio_input: false
          video_input: false
          pdf_input: false
          image_output: false
          audio_output: false

# ─── Local tier (this machine) ──────────────────────────────
# Runs on your own hardware — no API key, no subscription. `enabled`
# switches gate embeddings (ollama), local STT (whisper), and local TTS
# (piper). Disabled refs are skipped during voice-runtime build and
# embedding bring-up; the runtime degrades cleanly (BM25-only retrieval,
# etc.) rather than crashing.
local:
  enabled: true
  ollama:
    enabled: true
    base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    timeout_seconds: 120
    max_retries: 3
    models_endpoint: /api/tags
    auto_start: true   # Mirror startup may spawn `ollama serve` on localhost; set false in CI/headless
    host: this_pc
    adapter: ollama
    # Who is allowed to have signed OllamaSetup.exe before we run it
    # (`scripts/ensure_ollama.py`). One RDN of the Authenticode certificate
    # subject, written `<field>=<value>`. That field is parsed out and
    # compared for equality, case-insensitively — NOT searched for in the
    # subject string, which would also pass `O=Ollama Software Ltd` and
    # `OU=O=Ollama, O=Attacker LLC`. Pinning one field rather than the whole
    # distinguished name survives the reordering and reissue that certificate
    # renewals bring; a vendor renaming itself is meant to stop and ask.
    # Every other download in this repo is pinned by sha256; this one cannot
    # be, because the URL is unversioned by design.
    #
    # Unlike that URL — which stays in source, since a yaml write there
    # would choose what gets executed — this value only ever narrows what
    # is accepted. Weakening it wins nothing on its own: the URL is still
    # fixed, so an attacker would also have to be serving the binary.
    # Removing the key does not skip the check; verification fails closed
    # and the install is refused.
    installer_signer: "O=Ollama"
    models:
      nomic_embed:
        kind: embedding
        model: nomic-embed-text
        dimensions: 768
        timeout_seconds: 30
        max_retries: 3

  onnx_reranker:
    enabled: true
    adapter: onnx_reranker    # tesseract/memory/reranker.py - CPU, no VRAM
    timeout_seconds: 10
    max_retries: 1
    host: this_pc
    models:
      # `model`/`tokenizer` are filenames under `<TESSERACT_HOME>/models/reranker/`.
      # Absent files are a supported degraded mode (retrieval keeps RRF order);
      # fetch them with: python -m tesseract.scripts.fetch_reranker_model
      # (~23 MB int8 ONNX + tokenizer, sources under `download:` below; the
      # fetch verifies the pinned sha256 before installing).
      # Swapping this model is live — the config watcher's rebuild_adapters
      # re-resolves this role and swaps it into both RetrievalPipeline and
      # VaultSearchTool in place. No restart required.
      msmarco_minilm_l6:
        kind: reranker
        model: ms-marco-MiniLM-L-6-v2.int8.onnx
        tokenizer: tokenizer.json
        max_seq_len: 512
        candidate_cap: 30
        download:
          max_download_mb: 50
          base_url: https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main
          # Keyed by on-disk name. The model is published under a different
          # path than it is loaded from, so it carries an explicit `source`.
          files:
            ms-marco-MiniLM-L-6-v2.int8.onnx:
              sha256: e9d8ebf845c413e981c175bfe49a3bfa9b3dcce2a3ba54875ee5df5a58639fbe
              source: onnx/model_quantized.onnx
            tokenizer.json: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66

  whisper:
    enabled: true
    adapter: local_whisper
    timeout_seconds: 180    # 5-minute audio cap
    max_retries: 1
    models:
      # Catalog id matches the cost-ledger key for back-compat (`local_whisper`).
      # `model` carries the actual faster-whisper checkpoint name, and must be
      # one of the keys under `downloads:` below — anything else falls back to
      # faster-whisper's own unpinned HuggingFace download at first use.
      #
      # `large-v3-turbo` is the fresh-install default. Speech is the primary
      # input, and the wake gate matches `<prefix> <name>` against the
      # transcript, so STT accuracy on an arbitrary proper noun is what decides
      # whether the agent hears its own name. `base` mishears exactly that.
      # Drop to `small` (or `base`) on a machine where CPU synthesis latency
      # matters more than accuracy — the pins below cover all three, so the
      # swap is this one line plus a re-run of the fetch script.
      #
      # Leave `device: auto`: it probes this machine's CUDA device count AND
      # whether the cuBLAS runtime is actually loadable, then picks. Pinning
      # `cuda` by hand skips that probe, and a machine with an NVIDIA driver
      # but no CUDA runtime wheels then dies at first transcription with
      # "Library cublas64_12.dll is not found".
      #
      # `downloads:` is what stops the model arriving as an unpinned lazy pull
      # mid-conversation. Each key is a checkpoint name; `base_url` carries the
      # upstream revision, and every file is verified against its sha256 before
      # it is installed. Fetch with:
      #   python -m tesseract.scripts.fetch_whisper_model
      local_whisper:
        kind: stt
        model: large-v3-turbo
        device: auto            # "auto" | "cuda" | "cpu" — auto probes CUDA + cuBLAS per machine
        compute_type: int8      # raised to int8_float16 when auto resolves to cuda
        beam_size: 1
        timeout_seconds: 180
        preload: true
        cost_per_audio_hour: 0.00
        downloads:
          base:
            max_download_mb: 256
            base_url: https://huggingface.co/Systran/faster-whisper-base/resolve/ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
            files:
              config.json: 56a6d8110d311f19c8f0471e562832c7527f146b567275bfca59fcf7c184da9a
              model.bin: d01c3014881c9c6f3133c182f3d2887eb6ca1c789a7538c5c007196857a0a6a9
              tokenizer.json: fb7b63191e9bb045082c79fd742a3106a12c99513ab30df4a0d47fa6cb6fd0ab
              vocabulary.txt: 34ce3fe1c5041027b3f8d42912270993f986dbc4bb34cf27f951e34a1e453913
          small:
            max_download_mb: 640
            base_url: https://huggingface.co/Systran/faster-whisper-small/resolve/536b0662742c02347bc0e980a01041f333bce120
            files:
              config.json: b55496ac7940a7ae47d2c01eab40edfd8701feec1229d9cce3b40014383fb828
              model.bin: 3e305921506d8872816023e4c273e75d2419fb89b24da97b4fe7bce14170d671
              tokenizer.json: fb7b63191e9bb045082c79fd742a3106a12c99513ab30df4a0d47fa6cb6fd0ab
              vocabulary.txt: 34ce3fe1c5041027b3f8d42912270993f986dbc4bb34cf27f951e34a1e453913
          large-v3-turbo:
            max_download_mb: 2048
            base_url: https://huggingface.co/deepdml/faster-whisper-large-v3-turbo-ct2/resolve/4df90f75321148c3a29a9e2351b7ddf8f5b115a8
            files:
              config.json: b0253ea6c0d3bea6b1e19e91a02acfd3b53f4467362efcb5a3e6b16c9b3a9b7e
              model.bin: e76620f83d5f5b69efd3d87e3dc180c1bd21df9fbebacfd4335e5e1efcc018da
              preprocessor_config.json: 7ccc62c6f2765af1f3b46c00c9b5894426835a05021c8b9c01eecb6dfb542711
              tokenizer.json: 297b13372ac43916285644fb9687add3cc62ee2a1adb60da3dc25cc94c1871fd
              vocabulary.json: c69260f2ab26d659b7c398f9a2b2b48ed0df16c3b47d7326782fd9cba71690c1

  piper:
    enabled: true
    adapter: piper          # tesseract/voice/providers/piper_tts.py
    timeout_seconds: 60
    max_retries: 1
    host: this_pc
    models:
      # `model` is the ONNX filename under `runtime/models/voice/piper/`;
      # each voice needs BOTH the `.onnx` and its `.onnx.json` sidecar in
      # that directory. Fetch them with:
      #   python -m tesseract.scripts.fetch_piper_voice
      # Source: https://huggingface.co/rhasspy/piper-voices/tree/main/en/en_US
      #
      # Each voice's `download.base_url` is pinned to a specific upstream
      # commit, never a branch: an upstream re-upload of the release-equivalent
      # files must not silently change what a fresh install fetches. Bumping a
      # pin is a deliberate, reviewed edit. Every file is verified against its
      # sha256 before it is installed, and an existing file is never replaced.
      #
      # Two synthesis presets, picked by the TTS engine from the
      # `<intent>`/`<answer>` tag contract. Intent = quicker,
      # deterministic. Answer = natural pace, micro-variability for
      # warmth. Edit these to change the voice's character.
      hfc_female:
        kind: tts
        model: en_US-hfc_female-medium.onnx
        label: "HFC female — US female"
        gender: female
        sample_rate: 22050
        download:
          max_download_mb: 128
          base_url: https://huggingface.co/rhasspy/piper-voices/resolve/0d907f158acc877ddeebcbf827659ee13bea8bcd/en/en_US/hfc_female/medium
          files:
            en_US-hfc_female-medium.onnx: 914c473788fc1fa8b63ace1cdcdb44588f4ae523d3ab37df1536616835a140b7
            en_US-hfc_female-medium.onnx.json: 03f1fa0622b80463283592d97aca9f6e89aec345a5c56b7257723e0093c58b6c
        synthesis_presets:
          intent:
            length_scale: 0.95
            noise_scale: 0.0
            noise_w: 0.0
            sentence_silence: 0.2
          answer:
            length_scale: 1.0
            noise_scale: 0.4
            noise_w: 0.5
            sentence_silence: 0.2
        cost_per_million_chars: 0.00
      hfc_male:
        kind: tts
        model: en_US-hfc_male-medium.onnx
        label: "HFC male — US male"
        gender: male
        sample_rate: 22050
        download:
          max_download_mb: 128
          base_url: https://huggingface.co/rhasspy/piper-voices/resolve/0d907f158acc877ddeebcbf827659ee13bea8bcd/en/en_US/hfc_male/medium
          files:
            en_US-hfc_male-medium.onnx: d11e403a02bdf5a670c877b3dc56e0e1c8cece6fb30289586314dffdc0a78cb0
            en_US-hfc_male-medium.onnx.json: f66847424aed0bf99ecbb5d7cfde47c0a906f426a0daf7c46f305e7d21afd886
        synthesis_presets:
          intent:
            length_scale: 0.95
            noise_scale: 0.0
            noise_w: 0.0
            sentence_silence: 0.2
          answer:
            length_scale: 1.0
            noise_scale: 0.4
            noise_w: 0.5
            sentence_silence: 0.2
        cost_per_million_chars: 0.00
  kokoro:
    enabled: true
    adapter: kokoro         # tesseract/voice/providers/kokoro_tts.py
    timeout_seconds: 60     # warm-up cap; per-ref override in roles.yaml::voice.tts.settings
    max_retries: 1
    host: this_pc
    # The pin sits on the connection, not on each voice, because every
    # Kokoro voice below is a `mix` over these same two files rather than a
    # download of its own. Pinned to a release tag, never `latest`; each
    # file is verified against its sha256 before it is installed. Fetch:
    #   python -m tesseract.scripts.fetch_kokoro_voice
    download:
      max_download_mb: 512
      base_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
      files:
        kokoro-v1.0.onnx: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
        voices-v1.0.bin: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    models:
      # One 311 MB ONNX model holds every voice; a voice is a small style
      # embedding inside `voices-v1.0.bin`. So each entry below is not a
      # separate download — it is a `mix` over the same two files, fetched
      # once from the `download:` pin above.
      #
      # `mix` is voice_id -> weight. Give it two or more weights and the
      # style embeddings blend linearly — that is how a custom timbre is
      # designed. `kokoro.get_voices()` lists all 54 ids.
      #
      # `speed` is Kokoro's only pacing knob; these values mirror Piper's
      # intent/answer `length_scale` pair (0.95 shorter → 1.05 faster) so
      # switching lanes doesn't change the delivery.
      #
      # `device: cuda` is safe on a CPU-only machine — onnxruntime falls
      # back to CPUExecutionProvider and logs the downgrade.
      af_heart:
        kind: tts
        model: kokoro-v1.0.onnx
        voices_file: voices-v1.0.bin
        label: "Heart — US female"
        gender: female
        lang: en-us
        device: cuda
        sample_rate: 24000
        mix:
          af_heart: 1.0
        synthesis_presets:
          intent:
            speed: 1.05
            sentence_silence: 0.2
          answer:
            speed: 1.0
            sentence_silence: 0.2
        cost_per_million_chars: 0.00
      am_echo:
        kind: tts
        model: kokoro-v1.0.onnx
        voices_file: voices-v1.0.bin
        label: "Echo — US male"
        gender: male
        lang: en-us
        device: cuda
        sample_rate: 24000
        mix:
          am_echo: 1.0
        synthesis_presets:
          intent:
            speed: 1.05
            sentence_silence: 0.2
          answer:
            speed: 1.0
            sentence_silence: 0.2
        cost_per_million_chars: 0.00
