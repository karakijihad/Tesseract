# The assistant Cockpit — UI-facing configuration.
#
# # Tier-0 verification gate: runs a project's `verify` commands through the
# bash policy path before any model reviews the work.
verify:
  step_timeout_s: 600              # per-command ceiling; must stay <= the bash tool's 600s max
  output_head_lines: 40
  output_tail_lines: 60
  output_max_chars: 8000

conductor:
  relay_poll_s: 0.5
  # Stall ceiling for a lane turn's event stream: the turn is abandoned only
  # after this many seconds with NO new events (an active turn keeps
  # extending its own deadline). Not a cap on total turn duration.
  relay_timeout_s: 120
  # Accept-ack ceiling for lane commands. The ack only means "queued", not
  # "finished" — a lane turn can run far longer than this.
  lane_ack_timeout_s: 30
  # Max characters for a lane reply before truncation.
  reply_cap_chars: 24000

activity:
  # Boot-time registry rebuild only re-registers controller sessions whose
  # last activity falls inside this window; older sessions stay on disk but
  # are not re-registered.
  rebuild_session_window_hours: 48
