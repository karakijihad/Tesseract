# The assistant Cockpit — UI-facing configuration.
#
# # Tier-0 verification gate: runs a project's `verify` commands through the
# bash policy path before any model reviews the work.
verify:
  step_timeout_s: 600              # per-command ceiling; must stay <= the bash tool's 600s max
  output_head_lines: 40
  output_tail_lines: 60
  output_max_chars: 8000

conductor:
  relay_poll_s: 0.5
  # Stall ceiling for a lane turn's event stream: the turn is abandoned only
  # after this many seconds with NO new events (an active turn keeps
  # extending its own deadline). Not a cap on total turn duration.
  relay_timeout_s: 120
  # Accept-ack ceiling for lane commands. The ack only means "queued", not
  # "finished" — a lane turn can run far longer than this.
  lane_ack_timeout_s: 30
  # Max characters for a lane reply before truncation.
  reply_cap_chars: 24000

activity:
  # Boot-time registry rebuild only re-registers controller sessions whose
  # last activity falls inside this window; older sessions stay on disk but
  # are not re-registered.
  rebuild_session_window_hours: 48

kernel:
  # What the Kernel rail draws under `tool dispatch`. A group is the unit the
  # operator watches — the individual tool is what Pulse names — so the panel
  # shows the group and the count of what fired under it.
  #
  # Every tool the app SHIPS must match exactly one group. `assign_groups` in
  # `tesseract/cockpit/kernel_manifest.py` raises when one matches none or
  # more than one, on every request the panel makes, and a test reads the
  # names straight out of `kernel/tools/` so a tool that only registers with
  # credentials is counted too. That is what stops a newly registered tool
  # from quietly vanishing from the panel.
  #
  # A tool YOU wrote is not held to this. It cannot be, since this file is the
  # app's and an install cannot edit it; custom tools are drawn in their own
  # group instead of refusing the picture.
  #
  # `kind` picks the marker the rail draws: store is an index read from, seat
  # is a slot config fills, stage is a step the run passes through.
  tool_groups:
    - id: memory
      label: memory
      kind: store
      tone: info
      match: ["memory_*", "recall_history", "atlas_*", "playbook_*"]
    - id: vault
      label: vault
      kind: store
      tone: info
      match: ["vault_*"]
    - id: file
      label: file
      kind: stage
      match: ["file_*", "glob", "grep", "pdf_read", "open", "project_*"]
    - id: web
      label: web
      kind: stage
      match: ["web_search", "tavily_*", "context7_lookup", "browser_*",
              "public_image_download"]
    - id: agents
      label: agents
      kind: seat
      match:
        ["agent_*", "invoke_agent", "delegate_*", "spawn_*", "session_*",
         "lane_*", "skill_*", "controller_session_list",
         "start_controller_session", "work_send", "tool_search",
         "tool_register"]
    - id: channels
      label: channels
      kind: stage
      match: ["channel_*", "chat_initiate", "workspace_*", "gmail_*"]
    - id: surface
      label: surface
      kind: stage
      match: ["surface_*", "orb_visibility", "set_mood", "set_state",
              "tasks_*", "ask_clarification", "image_generate", "cockpit_show",
              "transcribe_audio"]
    - id: schedule
      label: schedule
      kind: stage
      match: ["schedule_*", "alarm_*"]
    - id: self
      label: self
      kind: store
      tone: info
      match: ["soul_growth_propose", "propose_change", "conscience_status",
              "diary_append", "log_triage", "brief_*", "return_note_read",
              "agenda_comment", "task_*", "context_read", "context_set"]
    - id: accounts
      label: accounts
      kind: store
      tone: warn
      match: ["credential_*", "api_request", "command_run"]
    - id: runtime
      label: runtime
      kind: stage
      match: ["autonomy_read", "day_read", "breaker_*", "health_leave",
              "health_repair", "pipeline_run_stage", "retention_set_window"]
    - id: shell
      label: shell
      kind: stage
      tone: warn
      match: ["bash", "os_launch", "os_open_url", "system_diagnose",
              "screen_look", "git"]
