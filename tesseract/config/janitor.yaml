# Janitor — orphaned-process sweep policy.
#
# Kill rule is fixed in code: a process is only reaped when it is an orphan
# (its parent is dead) AND it is identified as ours. This config cannot
# loosen the orphan requirement — it only names targets. Sweep cadence lives
# in schedule.yaml. `pattern` is a regex matched against the process's full
# command line.
#
# The patterns below describe processes THIS RUNTIME DID NOT LAUNCH, which is
# why a regex is the only handle on them. Everything the runtime spawns
# carries the `TESSERACT_REAPABLE` mark instead and needs no pattern here, so
# a seat pointed at a CLI nobody anticipated is still swept. The CLI binaries
# themselves are named once, in providers.yaml, and the janitor derives its
# fallback fingerprints from that for the case where a process's environment
# cannot be read at all.
#
# What is LEFT here is the live half: a process holding a port and a scratch
# directory holding a lock are problems now, which is why this also runs at
# every supervisor boot. Ageing files is not, and it moved to
# `config/retention.yaml` — one table for every tree this machine ages, swept
# once a night by the `retention` stage of the `consolidate` row.

process_fingerprints:
  # Claude Code hook scripts left running by a missing `jq` fallback.
  - id: hook-json-bridge
    pattern: "import json,sys,io"
  # Ad-hoc static file servers left over from dev sessions.
  - id: dev-http-server
    pattern: "-m http.server"
  # TESSERACT runtime processes (supervisor, mirror backend, controller)
  # whose parent died without reaping them. Deliberately a pattern and not a
  # mark: the backend hands its environment to every subprocess it runs for
  # the operator — a bash command, git, ollama — so marking it would put the
  # reaper's mark on all of them. `-m tesseract.` names our own module
  # invocations exactly and can never match someone else's process.
  - id: tesseract-runtime
    pattern: '-m tesseract\.'

# Scratch directories deleted from the repo root and tesseract/.
scratch_dir_globs:
  - ".pytest-tmp*"
  - ".pytest_tmp*"
  - ".codex-pytest-temp"
  - "tmp_*"

# Controller sessions marked "active" whose owning process is dead are
# closed once they're at least this stale, in hours.
stale_session_grace_hours: 24

# Detached-by-design processes stay exempt from the sweep while "claimed" —
# a heartbeat file younger than this many seconds counts as claimed.
claimed_heartbeat_max_age_s: 600
