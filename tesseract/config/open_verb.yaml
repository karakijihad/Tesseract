# `open` — the single verb for showing anything.
#
# Config is authority: every key here is required. The loader raises rather
# than substituting a default, so a missing search endpoint fails loudly at
# boot instead of quietly sending the operator somewhere they did not ask for.

# Where a bare query goes. `{query}` is URL-encoded at call time.
search_url: "https://duckduckgo.com/?q={query}"

# How long a frameability probe may take. On timeout the target is treated as
# unframeable and routed to the OS — a slow site becomes a browser tab rather
# than a card that never paints.
probe_timeout_s: 4.0

# Networks the probe refuses to reach. `open` fetches whatever URL it is
# given, so without this a target could be used to sweep the local network or
# a cloud metadata endpoint. Loopback and private ranges are deliberately NOT
# listed: opening `http://localhost:5173` is a normal thing to ask for on the
# operator's own machine.
blocked_networks:
  - 169.254.0.0/16   # link-local, incl. cloud metadata at 169.254.169.254
  - 100.64.0.0/10    # carrier-grade NAT
  - 198.18.0.0/15    # benchmark range
  - fe80::/10        # IPv6 link-local, the native form of the range above
  - ::ffff:169.254.0.0/112

# Applications `open` may launch by name. Deny-by-default: an identifier absent
# from this map is never launched, whatever it resolves to on PATH.
apps: {}

# Extensions the OS launch path may hand to ShellExecute: documents, media,
# and the data/markup/config the cockpit also renders as text. Executable,
# script and indirection types are refused in code regardless of what appears
# here, so a mis-edited list cannot enable them.
#
# The text formats are here so `open(..., destination="os")` on one of them
# reaches the program that owns it rather than dying on this allowlist. What
# the cockpit renders and what the OS may open had drifted apart, which is
# what `test_every_text_surface_can_also_be_handed_to_the_os` now pins.
#
# Deliberately NOT here: `.sh` (executes under an installed Git Bash) and
# `.ts` / `.tsx` / `.jsx` (execute under an installed JS runtime). Those are
# source files a machine may well be configured to RUN on double-click, which
# is the line this list exists to hold. `.py` / `.js` / `.rb` are refused in
# code regardless — see FORBIDDEN_LAUNCH_EXTENSIONS.
launch_extensions:
  - .html
  - .htm
  - .tsv
  - .log
  - .json
  - .xml
  - .yaml
  - .yml
  - .toml
  - .ini
  - .cfg
  - .css
  - .sql
  - .rs
  - .go
  - .java
  - .c
  - .h
  - .cpp
  - .hpp
  - .cs
  - .pdf
  - .doc
  - .docx
  - .xls
  - .xlsx
  - .ppt
  - .pptx
  - .odt
  - .ods
  - .rtf
  - .txt
  - .csv
  - .md
  - .markdown
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .webp
  - .svg
  - .bmp
  - .tiff
  - .mp3
  - .wav
  - .flac
  - .ogg
  - .m4a
  - .mp4
  - .webm
  - .mkv
  - .mov
  - .avi
  - .zip
