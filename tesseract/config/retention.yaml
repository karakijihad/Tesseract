# TESSERACT retention — everything this machine ages, in one table.
#
# Read it as the answer to "what does this machine throw away, and when".
# Four policies used to live in three files: two schedule.yaml config blocks,
# two janitor.yaml keys, and — for the approval ledger — nothing at all.
#
# WHEN it runs is not here. Every row below is swept by the `retention` stage
# of the nightly `consolidate` row, so the anchor in schedule.yaml is the only
# clock involved.
#
# `keep_days` is yours. `action` is yours where the tree allows it — two do
# not, and the loader refuses `delete` on those rather than quietly archiving
# instead. What each key means, and whether it may be deleted from at all,
# lives in tesseract/retention/policy.py, because a window is a number an
# operator should change and what a sweep DOES to a file is not.
#
# A key here that the code does not implement fails at load, and so does a
# tree the code implements that is missing here — a policy nothing enforces
# and a tree ageing on an unwritten default are the same defect.

trees:
  # One line per turn the assistant watched. Deleted: these are working notes
  # the observer has already turned into memory suggestions, and it is the
  # single most frequently written file in the system.
  observer_logs:
    keep_days: 14
    action: delete

  # History holds a working week; a conversation older than that is
  # marked archived where it is — same file, same id, same creation date —
  # and stays reachable from the rail's archive tab. Never deleted:
  # removing a conversation is your own act, through the app.
  sessions:
    keep_days: 7
    action: archive

  # controller/lanes-archive/<month>/<lane>/ — one directory per finished
  # delegation. Aged on the newest file inside, so a lane still being written
  # to is never taken.
  lane_archives:
    keep_days: 10
    action: delete

  # One copy of the whole project per delegated task that edited code, kept
  # after the task finished. A task that did NOT finish cleanly keeps its copy
  # whatever this says: that copy is the only place its work survives, and the
  # app would rather hold a stale one than lose the only output of a task that
  # went wrong.
  worker_archives:
    keep_days: 7
    action: delete

  # One file per backend launch, so the set grows with launches rather than
  # with use. The aggregate <process>.log beside them is bounded by size
  # rotation instead and is deliberately not swept here.
  backend_logs:
    keep_days: 60
    action: delete

  # One row per background job run. It is the biggest log this machine keeps
  # and the one the nightly rollup reads whole. Deleted rather than archived
  # because the summary already exists: `daily_writer` writes a per-day table
  # of runs, ok, failed and average duration into the daily log layer every
  # night, and a day with NO rollup keeps its rows regardless of this window.
  # Set `archive` instead if you want the raw rows kept in runs-archive/.
  scheduler_runs:
    keep_days: 30
    action: delete

  # One report per hourly sweep, plus a file per finding under evidence/.
  # The report IS the summary of the logs it read, and those logs have their
  # own windows above, so this is derived twice over. `latest.json` — the
  # pointer the morning brief reads — is never swept.
  watchman_reports:
    keep_days: 30
    action: delete

  # The drift check's record of how the runtime is trending. One row per run,
  # in files named by date. Only the latest row is ever read — drift is a
  # state, not a count — so a window removes history behind a verdict that
  # stays. The watchman's own judge writes no dated files: its standing-fault
  # store is a live pointer like `latest.json`, and it forgets a recovered
  # fault two days after announcing it.
  conscience:
    keep_days: 60
    action: delete

  # Every permission decision the runtime has made — the record an
  # investigation reads. Rows older than the window move to a dated file in
  # approvals-archive/ and are never dropped; `delete` is refused at load.
  # The window is not the lifetime: nothing here shortens how long the
  # evidence exists, only how much of it the live file carries. No number is
  # written in this comment on purpose, because the window below is editable
  # from the app and a comment restating it goes stale the first time it is.
  approvals_ledger:
    keep_days: 90
    action: archive

  # One row per tool call: at_utc, tool, session_id. It is the gauge the
  # working set is set from, and every question it answers is about a window —
  # the last week, the last fortnight. Deleted rather than archived: the row
  # carries no inputs and no outputs, so an old one holds nothing a new one
  # does not, and there is no investigation that would want it back.
  usage_ledger:
    keep_days: 90
    action: delete

  # The full record of every finished agenda item, bucketed by the month it
  # closed, and the index rows that describe it. Before a record is deleted,
  # one compact line about it is written to agenda/history/, which is never
  # aged, so an old task can still be named and counted. The completion
  # figures on the Autonomy panel read the index, so they cover this window.
  agenda_records:
    keep_days: 180
    action: delete

  # One record per conversation turn, in a directory named for the day it
  # started: the steps it took, and the one outcome it ended on. Recovery
  # reads the unfinished ones at boot, which is a question about the last few
  # minutes, and everything else it answers is about the last few days.
  # Deleted rather than archived because the conversation itself is the
  # durable copy: the transcript keeps what was said, and this keeps how the
  # turn ran. Set `archive` to keep the old records in runtime/turns/archive/.
  turn_manifests:
    keep_days: 30
    action: delete

  # One row each time the event loop was blocked long enough to threaten the
  # supervisor's heartbeat, with the frames it was in. Written only when it
  # happens, so a healthy machine adds nothing for weeks and a bad afternoon
  # adds a few hundred rows. Deleted rather than archived: the value is in
  # comparing this week with last week, and a block from the spring explains
  # nothing about today.
  loop_stalls:
    keep_days: 30
    action: delete

# What is deliberately NOT swept is declared in tesseract/retention/policy.py
# as `KEPT`, not as a comment here: from a directory listing a decision and an
# oversight look identical, so the app subtracts both lists from what it finds
# under the log trees and shows whatever is left as a tree nothing has decided
# about. If one of those starts growing, it gets a row above or a `Kept`
# entry, rather than a special case somewhere else.
