# TESSERACT retention — everything this machine ages, in one table.
#
# Read it as the answer to "what does this machine throw away, and when".
# Four policies used to live in three files: two schedule.yaml config blocks,
# two janitor.yaml keys, and — for the approval ledger — nothing at all.
#
# WHEN it runs is not here. Every row below is swept by the `retention` stage
# of the nightly `consolidate` row, so the anchor in schedule.yaml is the only
# clock involved.
#
# `keep_days` is yours. `action` is yours where the tree allows it — two do
# not, and the loader refuses `delete` on those rather than quietly archiving
# instead. What each key means, and whether it may be deleted from at all,
# lives in tesseract/retention/policy.py, because a window is a number an
# operator should change and what a sweep DOES to a file is not.
#
# A key here that the code does not implement fails at load, and so does a
# tree the code implements that is missing here — a policy nothing enforces
# and a tree ageing on an unwritten default are the same defect.

trees:
  # One line per turn the assistant watched. Deleted: these are working notes
  # the observer has already turned into memory suggestions, and it is the
  # single most frequently written file in the system.
  observer_logs:
    keep_days: 14
    action: delete

  # History holds a working week; a conversation older than that is
  # marked archived where it is — same file, same id, same creation date —
  # and stays reachable from the rail's archive tab. Never deleted:
  # removing a conversation is your own act, through the app.
  sessions:
    keep_days: 7
    action: archive

  # controller/lanes-archive/<month>/<lane>/ — one directory per finished
  # delegation. Aged on the newest file inside, so a lane still being written
  # to is never taken.
  lane_archives:
    keep_days: 10
    action: delete

  # One copy of the whole project per delegated task that edited code, kept
  # after the task finished. A task that did NOT finish cleanly keeps its copy
  # whatever this says: that copy is the only place its work survives, and the
  # app would rather hold a stale one than lose the only output of a task that
  # went wrong.
  worker_archives:
    keep_days: 7
    action: delete

  # One file per backend launch, so the set grows with launches rather than
  # with use. The aggregate <process>.log beside them is bounded by size
  # rotation instead and is deliberately not swept here.
  backend_logs:
    keep_days: 60
    action: delete

  # One row per background job run. It is the biggest log this machine keeps
  # and the one the nightly rollup reads whole. Deleted rather than archived
  # because the summary already exists: `daily_writer` writes a per-day table
  # of runs, ok, failed and average duration into the daily log layer every
  # night, and a day with NO rollup keeps its rows regardless of this window.
  # Set `archive` instead if you want the raw rows kept in runs-archive/.
  scheduler_runs:
    keep_days: 30
    action: delete

  # One report per hourly sweep, plus a file per finding under evidence/.
  # The report IS the summary of the logs it read, and those logs have their
  # own windows above, so this is derived twice over. `latest.json` — the
  # pointer the morning brief reads — is never swept.
  watchman_reports:
    keep_days: 30
    action: delete

  # The drift check's record of how the runtime is trending. One row per run,
  # in files named by date. Only the latest row is ever read — drift is a
  # state, not a count — so a window removes history behind a verdict that
  # stays. The watchman's own judge writes no dated files: its standing-fault
  # store is a live pointer like `latest.json`, and it forgets a recovered
  # fault two days after announcing it.
  conscience:
    keep_days: 60
    action: delete

  # One row per helper the assistant called on, and when. A year rather than a
  # month, and that is the whole point of the row: a helper MISSING from this
  # file has never run, which is how the roster tells an unused helper from a
  # busy one, so a short window would report a helper you used in the spring as
  # one you have never used. A row is a name and a time. Deleted rather than
  # archived, and `archive` is refused at load: the rows are pruned inside their
  # file and there is nowhere for a row to be moved to. The shortest window this
  # one takes is the span the roster counts over, which is set in code.
  agent_invocations:
    keep_days: 365
    action: delete

  # One row each time the assistant read a set of instructions, and one each
  # time you corrected it afterwards. It is the evidence behind rewriting
  # instructions that keep going wrong, and the job that reads it looks at a
  # much shorter span, so this is what gives that job something to read.
  # Pruned inside its file, so `archive` is refused at load.
  skill_usage:
    keep_days: 90
    action: delete

  # One row per tidy-up run when the app started. Only recent rows are read,
  # and only for a tidy-up that reported an error, so an old row answers
  # nothing. Pruned inside its file, so `archive` is refused at load.
  janitor_sweeps:
    keep_days: 90
    action: delete

  # One row each time a tool result was shortened before the assistant read it.
  # A row per call rather than per day, which makes it the fastest growing of
  # the small records here. Nothing in the app reads it: it is there so you can
  # check that shortening is hitting the right results, and that is a question
  # about recent calls. Pruned inside its file, so `archive` is refused at load.
  tokenjuice_audit:
    keep_days: 30
    action: delete

  # Your day by day session record: a line each time a session closed or a
  # conversation was consolidated, and one journal per session of the
  # background work it started. Hundreds of close lines a day against a handful
  # worth reading, which is what this window is for.
  #
  # The nightly summary of background jobs inside these files is NOT removed,
  # whatever this says. `scheduler_runs` above only trims a day of job rows
  # once that summary exists, so deleting it would stop the largest log on the
  # machine ageing for ever. Deleted rather than archived, and `archive` is
  # refused at load: the file is rewritten with its summaries still in it, and
  # half a file cannot be moved aside.
  session_journal:
    keep_days: 30
    action: delete

  # Everything the watchdog wrote down while the app was in trouble: one file
  # per stack it captured from a backend that stopped answering, one per crash
  # storm it cleared, and one row per failed health check. Written only when
  # something goes wrong, so a healthy machine adds nothing for weeks. The
  # captured stacks are by far the largest part. Deleted rather than archived,
  # and `archive` is refused at load: the rows are pruned inside their file and
  # there is nowhere for a row to be moved to.
  supervisor_incidents:
    keep_days: 30
    action: delete

  # One file per run of the memory tidy-up, holding every merge, soul edit and
  # retirement it suggested that day. Deleted rather than archived: each
  # suggestion also arrives as a card carrying what it would change, so the
  # card is the copy you act on and this is the working note behind it. Set
  # `archive` if you want the old notes kept in consolidator/archive/.
  consolidator_proposals:
    keep_days: 30
    action: delete

  # The same shape one directory over: the memories the nightly reading of your
  # conversations suggested saving. Its own window rather than a shared one,
  # because a day the consolidator ran is not a day this ran.
  feedback_proposals:
    keep_days: 30
    action: delete

  # Every permission decision the runtime has made — the record an
  # investigation reads. Rows older than the window move to a dated file in
  # approvals-archive/ and are never dropped; `delete` is refused at load.
  # The window is not the lifetime: nothing here shortens how long the
  # evidence exists, only how much of it the live file carries. No number is
  # written in this comment on purpose, because the window below is editable
  # from the app and a comment restating it goes stale the first time it is.
  approvals_ledger:
    keep_days: 90
    action: archive

  # One row per tool call: at_utc, tool, session_id. It is the gauge the
  # working set is set from, and every question it answers is about a window —
  # the last week, the last fortnight. Deleted rather than archived: the row
  # carries no inputs and no outputs, so an old one holds nothing a new one
  # does not, and there is no investigation that would want it back.
  usage_ledger:
    keep_days: 90
    action: delete

  # The full record of every finished agenda item, bucketed by the month it
  # closed, and the index rows that describe it. Before a record is deleted,
  # one compact line about it is written to agenda/history/, which is never
  # aged, so an old task can still be named and counted. The completion
  # figures on the Autonomy panel read the index, so they cover this window.
  agenda_records:
    keep_days: 180
    action: delete

  # One record per conversation turn, in a directory named for the day it
  # started: the steps it took, and the one outcome it ended on. Recovery
  # reads the unfinished ones at boot, which is a question about the last few
  # minutes, and everything else it answers is about the last few days.
  # Deleted rather than archived because the conversation itself is the
  # durable copy: the transcript keeps what was said, and this keeps how the
  # turn ran. Set `archive` to keep the old records in runtime/turns/archive/.
  turn_manifests:
    keep_days: 30
    action: delete

  # One line per mark a turn left in the world: a message id, a commit hash, a
  # file's content hash. Joined to the step that produced it by the turn id and
  # the stage name, both of which live in `turn_manifests` above.
  #
  # The same window as the records it joins to, deliberately and not by
  # coincidence. A receipt outliving its step is a mark nobody can attribute,
  # and a step outliving its receipt is a claim that lost its evidence. Change
  # one of these two numbers and you have to change the other.
  receipts:
    keep_days: 30
    action: delete

  # One row each time the event loop was blocked long enough to threaten the
  # supervisor's heartbeat, with the frames it was in. Written only when it
  # happens, so a healthy machine adds nothing for weeks and a bad afternoon
  # adds a few hundred rows. Deleted rather than archived: the value is in
  # comparing this week with last week, and a block from the spring explains
  # nothing about today.
  loop_stalls:
    keep_days: 30
    action: delete

  # What the work was, what happens next, and where a turn had got to. One
  # record per conversation boundary, plus the cursor rows a crash is picked
  # up from. The cursor rows are bounded inside the file itself, because a
  # conversation used every day never gets old enough for this window to
  # reach it.
  # It holds references rather than copies, so nothing here is the only copy
  # of anything — the conversation keeps what was said and the memory store
  # keeps what it taught. Deleted rather than archived because the record is
  # read to pick work back up, and a boundary from last month describes work
  # that has either moved on or been forgotten.
  checkpoints:
    keep_days: 30
    action: delete

  # The inbox: every card the runtime has put in front of you, and the replies
  # on it. Only a card you have ANSWERED ages, whatever its date, so nothing
  # here can lose a decision still waiting on you. Deleted rather than
  # archived because an answered card is a moment that has passed, and what it
  # changed is recorded wherever the change landed.
  workspace_events:
    keep_days: 60
    action: delete

# What is deliberately NOT swept is declared in tesseract/retention/policy.py
# as `KEPT`, not as a comment here: from a directory listing a decision and an
# oversight look identical, so the app subtracts both lists from what it finds
# under the log trees and shows whatever is left as a tree nothing has decided
# about. If one of those starts growing, it gets a row above or a `Kept`
# entry, rather than a special case somewhere else.
