# Which tools the assistant sees without having to look them up.
#
# Every tool it has is always callable by name. This file decides only which
# ones are described to it on every turn, so it reaches for them directly.
# Everything else it finds with `tool_search`, which costs one extra step and
# nothing else. Taking a tool off this list makes it slower to reach, never
# forbidden — what the assistant is ALLOWED to do is `permissions.yaml`, and
# that is a separate question with a separate answer.
#
# So this is a spending dial. Tool descriptions are roughly half of what a turn
# costs before you have typed anything. Conscience -> Usage shows you the
# figure and which tools you actually call: trim the ones you never use and
# turns get cheaper, add one you reach for often and it stops costing a search
# first.
#
# THE NAMES UNDER `core:` ARE YOURS. Edit them here, or from Conscience. The
# groupings and the descriptions beside them are not: they are read off the
# tools themselves every time this file is written, so they cannot drift from
# what the tools actually do. Regenerate after a hand-edit with
#   python -m tesseract.scripts.generate_working_set --write
#
# `tool_search` is added back if you remove it. It is the door to everything
# not on this list, and without it the assistant can only reach what is
# written here.
#
# A name nothing answers to stops the app at startup and says which one it was,
# because a typo that quietly did nothing is how a tool goes missing for weeks.
#
# An update replaces this file with the new release's version and keeps your
# old one in `config-backup/`. If you have changed the list, copy it back.


core:
  # Remembering
  - atlas_query  # Ask how records connect, with a citation for every hop.
  - diary_append  # Append a first-person reflection to the assistant's private diary.
  - memory_get  # Read a line-range slice of one known memory-store markdown file.
  - memory_save  # Write a new durable memory to the persistent store.
  - memory_search  # Search the persistent memory store by query, ranked by relevance.
  - memory_update  # Revise an existing memory's content, title, importance, or tags.
  - recall_history  # Search past session transcripts and workshop artifacts by free text.
  - soul_growth_propose  # Queue a distilled SOUL.md Growth bullet for operator approval.
  # Research library
  - vault_query  # Synthesizes an answer from the vault's compiled wiki of topic-grouped summaries.
  - vault_search  # Hybrid BM25 + vector search over raw vault source chunks.
  # Searching the web
  - tavily_extract  # Extracts clean markdown from one or more specific URLs via Tavily.
  - tavily_search  # Web search via Tavily. Snippets shaped for a model, plus an optional answer.
  - web_search  # Web search via Brave. A ranked list of title, URL and short snippet.
  # Files on disk
  - file_read  # Read a file's contents as numbered lines.
  - file_write  # Write content to a file, creating parent directories as needed.
  - glob  # Find files by path/name pattern, newest first.
  - grep  # Search file contents for a regex pattern via ripgrep.
  # Showing the operator something
  - open  # Show the operator anything that exists: a URL, a file, a folder, an app, or a search.
  - surface_close  # Destroy a surface and remove its card from the canvas.
  - surface_control  # Operate a card on the canvas: play, pause, volume, or press its controls.
  - surface_create  # Author a card from content you generated: html, markdown, code, or a chart.
  - surface_list  # List surfaces on a canvas view: id, type, title, mode, and whether each one rendered.
  - surface_update  # Mutate an existing surface's props or title (shallow merge).
  # Driving a web page
  - browser_navigate  # Drive a headless browser and show a screenshot of the page on the canvas.
  # Looking for yourself
  - browser_screenshot  # Capture an open browser page and refresh its card.
  - browser_snapshot  # Read the accessibility tree of an open browser page.
  - screen_look  # Look at the operator's own screen and answer one question about it.
  # Handing work to someone else
  - agent_ask  # Lets a background sub-agent ask its dispatcher a question and wait for the reply.
  - agent_create  # Drafts a new markdown sub-agent proposal, quarantined until the operator promotes it.
  - agent_promote  # Moves a quarantined agent from pending into the active, invokable set.
  - delegate_agent_controller  # Dispatches a task to a fresh agent controller session running the full assistant brain.
  - delegate_auditor  # Delegates a review task to whichever CLI fills the auditor seat.
  - delegate_coder  # Delegates a coding task to whichever CLI fills the coder seat.
  - invoke_agent  # Dispatches a bounded task to a markdown-defined sub-agent with a read-only tool subset.
  # Long-running collaborators
  - lane_list  # Enumerate every live lane_id the controller currently hosts.
  - lane_named_list  # List every persistent name-to-lane_id binding, orphans included.
  - lane_read  # Pull a lane's events since a cursor. Reads the tail and sends nothing.
  - lane_status  # Fast read-only probe of one lane's alive/busy/queue_depth state.
  - lane_turn  # Send a message into a lane and wait for that one turn's reply, in one call.
  - session_list  # List every open interactive session with its handle and target.
  # Tracking what you spawned
  - spawn_await  # Blocks until a background spawn finishes and returns its full result.
  - spawn_cancel  # Cancels a running background spawn and waits for it to unwind.
  - spawn_check  # A background spawn: running, done, failed or cancelled, and when it last emitted.
  - work_send  # Sends a steering message into a running lane, session, or controller session.
  # Running commands
  - bash  # Runs a raw shell command through the operating system.
  # Reaching the operator elsewhere
  - channel_history_read  # Read past channel conversation directly from the per-day logs.
  - channel_send_photo  # Send an image inline on an external chat channel.
  - channel_send_voice  # Send a spoken voice note on an external chat channel.
  - workspace_decide  # Answer one thing waiting in the operator's inbox.
  # Work you owe
  - task_close  # Close a task as done with its evidence, or as failed with the reason.
  - task_propose  # Turn a request into a task that is owed until it is verified.
  - task_work  # Take an accepted task up in this turn and read what it owes.
  # Asking without blocking
  - propose_change  # Request a change to an operator-owned workspace file, gated on approval.
  - workspace_reply  # Reply inside an existing Workspace event's operator comment thread.
  # Being present in the Mirror
  - set_mood  # Sets affective mood: intensity (energy) and valence (cool-warm tone).
  - set_state  # Sets a discrete orb state: happy, deep_focus, dreaming, or idle.
  - tasks_set  # Replaces the full operator-visible task checklist for this turn.
  - tasks_update  # Flips one task's status or renames it, by id, without touching the rest.
  # Time
  - schedule_list  # Lists registered scheduler jobs with cadence, enabled state, and last-fire time.
  # Projects
  - git  # Run version control on a repository: inspect it, commit, branch, push.
  - project_list  # List every registered project, its root, git identity, and which is active.
  # Your own accounts
  - api_request  # Call a web service with one of your own accounts, without seeing the value.
  - command_run  # Run your own code with one of your accounts in its environment.
  - credential_list  # Your own accounts: service, username, purpose, and whether each is ready.
  # Extending yourself
  - skill_create  # Draft a new skill or playbook into the pending quarantine.
  - skill_promote  # Move a quarantined skill into the active set.
  - skill_refine  # Revise an existing active skill or playbook.
  # Checking your own state
  - autonomy_read  # Read what the Autonomy panel says, in the same sentences it shows.
  - health_leave  # Stop a Health finding asking for attention, or have it count again.
  - session_continue  # Carry the work into a fresh start, or finish with this conversation.
  - system_diagnose  # Report this machine's runtime health in one call.
  - workspace_pending  # List what is waiting on the operator to decide.
  # Finding a tool
  - tool_search  # Make a tool callable that is not in this turn's schema.
  # Finding a playbook
  - playbook_search  # Read the whole of a playbook the turn is carrying only as a line.

