# Mirror HTTP/WS server binding. Local-only, single-operator, no auth.

server:
  host: 127.0.0.1
  port: 8000

identity:
  # What the agent is called — surfaced in the cockpit header, in everything
  # it says about itself, and in the wake phrase. First-run setup asks for
  # this and writes it here; these two values are the fallback for a setup
  # that was skipped or could not be applied.
  #
  # Deliberately not a name. A shipped stand-in name is indistinguishable
  # from one the operator chose, so an install whose setup silently failed
  # would look configured instead of looking unnamed. It matches the noun
  # the frontend falls back to before `/api/identity` answers
  # (`useEntityName.ts::ENTITY_FALLBACK`).
  name: Assistant
  # Display name used for chat bubbles and greetings. Change this to your
  # own name.
  operator_name: Operator
  # `male`, `female`, or `unspecified`. First-run setup asks this once and
  # writes it here; it already picked the voice, and this is the same answer
  # reaching the agent's own sense of itself rather than only its synthesis.
  #
  # Pronouns are derived, never stored beside this: two fields could
  # disagree, and then nothing downstream knows which one is the operator's
  # real answer. `unspecified` renders they/them and is the shipped default
  # for the same reason `name` ships as `Assistant` — a setup that silently
  # failed must look unconfigured, not look chosen.
  gender: unspecified

  # Wake-word gate for the mic modes that dispatch a turn (`command`,
  # `speak`). `transcribe` and `terminal` are never gated — those hand
  # the transcript to the operator, not to the brain. Off = every
  # utterance dispatches.
  #
  # The phrase is `<prefix> <name>`, which is why it lives here: `name`
  # above is what it is built from, and it is re-read per utterance, so
  # a rename re-teaches the gate with no restart. `match_threshold` is
  # normalized edit-distance similarity (1.0 = exact) over the head of
  # the transcript — low enough to tolerate how STT spells an arbitrary
  # name, high enough that unrelated speech never scores.
  wake_word:
    enabled: false
    prefix: hey
    match_threshold: 0.72

voice:
  # The line spoken when a voice is auditioned from the Identity tab.
  # `{name}` renders the current `identity.name` above, so the sample
  # follows a rename without an edit here; a template without it is
  # spoken verbatim. Which voice speaks it is `roles.yaml::voice.tts`.
  test_sample: "Hello, this is {name}. This is how I sound."

cors:
  # EXTRA origins allowed to call the REST/WS API from a browser. The
  # packaged app's own webview origins (tauri.localhost) are built into
  # the server (mirror/server/cors.py::PACKAGED_APP_ORIGINS) and need no
  # entry here.
  origins:
    - http://localhost:5173
    - http://localhost:1420

logging:
  # Durable rotating file logs for the long-lived processes (mirror
  # backend, agent controller). Filename is <process>.log under dir.
  dir: logs                 # relative to TESSERACT_HOME
  max_bytes: 5242880        # rotate at 5 MB
  backup_count: 3
  # Per-logger floors applied to the file handler only; console output
  # keeps full verbosity.
  file_min_levels:
    aiohttp.access: WARNING
    httpx: WARNING

terminal:
  # Operator-direct PTY channel. Bypasses the assistant permission engine by
  # design — this is a raw shell, not an assistant tool call.
  default_shell: cmd
  max_tabs: 8
  max_panes_per_tab: 4
  shell_profiles:
    cmd:    { argv: [cmd.exe], label: Command Prompt }
    bash:   { argv: [bash],    label: Bash }
    claude: { argv: [claude],  label: Claude CLI }
    codex:  { argv: [codex],   label: Codex CLI }

uploads:
  chat:
    max_file_mb: 50
    max_total_mb: 50
    max_files_per_message: 5
    allowed_mime_types:
      - image/png
      - image/jpeg
      - image/webp
      - image/gif
      - application/pdf
      # Audio is auto-transcribed by local Whisper before the chat brain
      # sees the message.
      - audio/wav
      - audio/mpeg
      - audio/mp4
      - audio/webm
      - audio/ogg
      - audio/flac

ui:
  # Show a toast whenever a config yaml file is reloaded after an edit.
  show_config_reload_toasts: true

code_watch:
  # Background watcher that detects when the working tree changes under a
  # running backend (e.g. you edited and saved source while it's live).
  enabled: true
  interval_seconds: 30
  # If true, a restart-required drift schedules an automatic restart
  # instead of waiting for you to click the toast.
  auto_restart: false
  show_toast: true

session:
  # Auto-resume policy when reopening the Mirror UI.
  # today_only           — only sessions saved today auto-resume
  # today_plus_yesterday — covers an overnight gap
  # n_days               — sessions newer than resume_days days
  # always               — resume any session, however old
  resume_policy: today_plus_yesterday
  resume_days: 1

mission:
  # Lane-aware work queue. Each worker:<kind> lane caps how many steps of
  # that kind run concurrently across all missions. Tune max_concurrent to
  # match your CLI subscription's parallelism — coder_seat/auditor_seat are
  # typically 1 (one shell each); markdown_agent and agent_self can fan out
  # further.
  #
  # retry: feeds the worker retry policy — retry_on_classes lists error
  # classes worth retrying; give_up_on_classes short-circuits regardless of
  # retry budget. Omitting retry keeps a kind at zero retries.
  lanes:
    worker:
      coder_seat:
        max_concurrent: 1
        retry:
          max_retries: 1
          backoff_seconds: 30
          retry_on_classes: [transient_network, pty_timeout]
          give_up_on_classes: [permission_denied, budget_exceeded, operator_cancelled]
      auditor_seat:
        max_concurrent: 1
        retry:
          max_retries: 1
          backoff_seconds: 30
          retry_on_classes: [transient_network, pty_timeout]
          give_up_on_classes: [permission_denied, budget_exceeded, operator_cancelled]
      markdown_agent:
        max_concurrent: 4
        retry:
          max_retries: 1
          backoff_seconds: 5
          retry_on_classes: [transient_network]
          give_up_on_classes: [permission_denied, budget_exceeded, operator_cancelled]
      agent_self:
        max_concurrent: 4
        retry:
          max_retries: 0
          backoff_seconds: 0
          retry_on_classes: []
          give_up_on_classes: []
