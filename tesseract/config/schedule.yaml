# The jobs the app runs on its own, and when.
#
# This file is the app's. It is read and never written: when you turn a job off
# or move the one that fires at a set time, that choice is saved to your own
# schedule file as an override, so a correction in a later release still
# reaches you. What you may change is enable and disable on any row, plus the
# hour of the row that fires at a time of day. How often the rest run is part
# of what the work is.
#
# Times are your computer's local time. If the machine was off when a job was
# due, the app runs it once on the next start rather than replaying every
# missed turn.

catchup:
  concurrency: 3
jobs:
- name: capture
  cadence: '*/5 * * * *'
  handler: tesseract.scheduler.tasks.capture_pipeline.CapturePipelineJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    leaf_intake:
      extract_max_per_tick: 64
      append_max_per_tick: 256
    leaf_seal:
      max_buffer_leaves: 20
      max_buffer_age_seconds: 3600
      max_seals_per_tick: 32
    conversation_reflect:
      idle_minutes: 30
      lookback_hours: 48
      tail_turns: 40
      max_per_tick: 20
- name: consolidate
  cadence: 0 23 * * *
  handler: tesseract.scheduler.tasks.consolidate_pipeline.ConsolidatePipelineJob
  enabled: true
  on_failure: alert
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    chat_digest:
      chain: chain_1
      max_digest_chars: 6000
    librarian_heartbeat:
      chain: chain_1
    feedback_sweep:
      chain: chain_1
    feedback_consolidator:
      chain: chain_1
    memory_scrub:
      mode: fix
    provider_probe: {}
    brief_render:
      chain: chain_1
    retention: {}
    agenda_reap:
      max_age_days:
        blocked: 14
        resume_queued: 14
        proposed: 21
        unvetted: 21
        awaiting_operator: 30
      exempt_sources:
      - operator
- name: watchman
  cadence: 15 * * * *
  handler: tesseract.scheduler.tasks.watchman.WatchmanJob
  enabled: true
  on_failure: log
  model_role: watchman
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config: {}
- name: skill_refinement
  when: skill_usage_volume
  when_config:
    min_new_rows: 40
  handler: tesseract.scheduler.tasks.skill_refinement.SkillRefinementJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    window_days: 14
    min_loads: 4
    ratio_threshold: 0.34
    max_cards: 3
- name: working_set_review
  when: tool_usage_volume
  when_config:
    min_new_calls: 400
  handler: tesseract.scheduler.tasks.working_set_review.WorkingSetReviewJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    window_days: 14
    min_sessions_to_carry: 4
    min_loads_to_carry: 4
    min_calls_to_judge: 50
    max_proposals: 8
- name: runtime_tuning
  when: spend_volume
  when_config:
    min_new_rows: 6000
  handler: tesseract.scheduler.tasks.runtime_tuning.RuntimeTuningJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    window_days: 14
    min_days_to_judge: 7
    at_cap_fraction: 0.9
    days_at_cap_to_raise: 3
    raise_factor: 2.0
    idle_fraction: 0.1
    lower_headroom: 2.0
    kinds:
      ceiling: true
- name: playbook_extract
  when: tasks_done_volume
  when_config:
    min_new_tasks: 1
  handler: tesseract.scheduler.tasks.playbook_extract.PlaybookExtractJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    min_tool_steps: 3
    max_proposals: 2
- name: skill_suggest
  when: digest_volume
  when_config:
    min_new_digests: 7
  handler: tesseract.scheduler.tasks.skill_suggest.SkillSuggestJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config:
    lookback_days: 14
    max_suggestions: 2
- name: provider_probe
  when: provider_failover
  when_config:
    min_new_tripwires: 2
  handler: tesseract.scheduler.tasks.provider_probe.ProviderProbeJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config: {}
- name: janitor_sweep
  cadence: 24h
  handler: tesseract.scheduler.tasks.janitor_sweep.JanitorSweepJob
  enabled: true
  on_failure: log
  retry_policy:
    max_retries: 0
    backoff_seconds: 0
  config: {}
