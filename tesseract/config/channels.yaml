# Per-channel adapter configuration.
#
# Two tiers:
#   * defaults:         — settings every channel inherits unless overridden.
#   * <channel-name>:   — one block per adapter (e.g. telegram). Only list
#                         the keys you want to override; everything else
#                         still inherits from defaults.
#
# Tokens/secrets live in .env, never here. Edits to this file reload live —
# no restart needed.
#
# To add a channel: add a `<name>:` block with `enabled`, `display_name`,
# and any channel-specific fields.

defaults:
  # No retention knob. A channel session is bounded by COMPACTION, the same
  # hook and the same threshold the cockpit uses — `roles.yaml::chat_brain`
  # owns it, and a per-channel copy would only let the two disagree. The one
  # boundary a channel has of its own is a new local day, which is offered
  # rather than taken (`integrations/_channel_session.py`).

  # Per-kind attachment size/duration caps. Anything larger is rejected.
  attachments:
    voice:    { max_seconds: 600 }
    audio:    { max_seconds: 1800 }
    photo:    { max_bytes: 10485760 }
    document: { max_bytes: 26214400 }
    video:    { max_seconds: 60, max_bytes: 52428800 }

  # Text-extraction caps for decoded attachments.
  extract:
    document_chars: 6000
    image_caption_chars: 800

  # Daily spend ceiling for tools billed per channel turn (e.g. vision).
  cost:
    daily_max_usd: 1.50
    per_role:
      channel_vision: 0.50

  # How an ASK-gated action behaves when it originates from a channel turn.
  # on_ask: workspace_nudge posts a notice and keeps the conversation open;
  # on_ask: deny rejects the action outright.
  gate_policy:
    on_ask: workspace_nudge
    # How long a gated call waits for you to approve or reject it before
    # refusing itself. Sending another message cancels the wait.
    decision_timeout_s: 1800

# ────────────────────────────────────────────────────────────────────
# Telegram
# ────────────────────────────────────────────────────────────────────
telegram:
  enabled: true
  display_name: Telegram

  # The `.env` key this channel needs. Named here rather than in
  # providers.yaml because the channel is ours and its credential belongs
  # with it — the capability report and the first-run form read this, so
  # neither has to keep its own list of which channel needs which key.
  api_key_env: TELEGRAM_BOT_TOKEN

  # Push a daily-brief summary to this channel when one is ready.
  brief_push: true

  # Outbound notification rate limits, so autonomy doesn't flood the
  # channel. Safety-critical categories (recovery, crash alerts, approval
  # requests) always get through regardless of these caps.
  outbound_rate:
    default_per_hour: 6
    per_category:
      runtime_report: 2               # the watchman checks hourly and only pings on a defect; two an hour is already a bad day

  # Notification categories the operator has muted via the dashboard.
  muted_categories: []

  # ─── Optional per-channel overrides (uncomment to override defaults) ───
  # attachments:      { document: { max_bytes: 52428800 } }
  # extract:          { document_chars: 12000 }
  # cost:             { daily_max_usd: 5.00 }
  # gate_policy:      { on_ask: deny }
