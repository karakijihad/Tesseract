[package]
name = "tesseract-mirror"
version = "1.0.10"
description = "TESSERACT desktop shell"
authors = ["TESSERACT"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tesseract_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Self-update (2026-07-29): release check + installer download from the
# private GitHub repo. `ureq` over reqwest — blocking fits the command
# handlers, tiny dependency surface. Redirects are handled manually so the
# GitHub token is never forwarded to the S3 asset host.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

