[package]
name = "tesseract-mirror"
version = "1.1.1"
description = "TESSERACT desktop shell"
authors = ["TESSERACT"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tesseract_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Self-update: release check + installer download from GitHub Releases,
# anonymously. `ureq` over reqwest — blocking fits the command handlers, tiny
# dependency surface. Redirects are followed manually rather than by the
# agent, so the hop to the pre-signed asset host is ours to control.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

# A Job Object with kill-on-close, so a crash or an end-task takes the
# provisioning downloads with it — the one case no exit handler can cover.
# Already in the tree transitively at this version; named here so the three
# symbols `job.rs` needs are guaranteed rather than inherited.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",       # `CreateJobObjectW` names SECURITY_ATTRIBUTES
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

