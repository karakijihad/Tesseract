<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  html,body{height:100%;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#0b1020;color:#e8f1ff;overflow:hidden;}
  .wrap{height:100%;display:flex;gap:12px;padding:12px;box-sizing:border-box;}
  .panel{width:300px;flex:0 0 auto;background:#0f1630;border:1px solid rgba(140,180,255,.18);border-radius:12px;padding:12px;box-sizing:border-box;}
  .title{font-weight:900;margin-bottom:6px;font-size:14px;letter-spacing:.2px;}
  .hint{font-size:12px;line-height:1.35;color:rgba(232,241,255,.85);margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  label{font-size:12px;color:rgba(232,241,255,.9);white-space:nowrap;}
  select{width:100%;background:#16224a;border:1px solid rgba(140,180,255,.25);color:#e8f1ff;border-radius:10px;padding:8px 10px;}
  input[type="color"]{border:none;background:transparent;padding:0;}
  input[type="range"]{width:100%;}
  button{width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(140,180,255,.25);background:#16224a;color:#e8f1ff;cursor:pointer;}
  button:hover{border-color:rgba(140,180,255,.45)}
  #status{font-size:11px;color:rgba(232,241,255,.75);margin-top:8px;min-height:14px;}
  .stage{flex:1 1 auto;min-width:0;}
  canvas{width:100%;height:100%;display:block;border-radius:12px;border:1px solid rgba(140,180,255,.18);touch-action:none;cursor:crosshair;background:linear-gradient(180deg,#0b1020,#090d18 65%,#060a13);}
  kbd{background:rgba(140,180,255,.15);border:1px solid rgba(140,180,255,.25);padding:1px 6px;border-radius:8px;font-size:11px;}
  .btnRow{display:flex;gap:10px;}
  .btnRow button{width:50%;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">Doodle</div>
      <div class="hint">Drag to draw. Click = dot/stamp. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo.</div>

      <div class="row" style="margin-top:12px;">
        <label for="pen">Pen</label>
        <select id="pen">
          <option value="brush" selected>Brush (neon)</option>
          <option value="pencil">Pencil</option>
          <option value="marker">Marker</option>
          <option value="sigil">Sigil (stamps)</option>
        </select>
      </div>

      <div class="row">
        <label for="color">Color</label>
        <input id="color" type="color" value="#7cf7ff" style="width:44px;height:30px"/>
      </div>

      <div class="row" style="flex-direction:column;align-items:stretch;gap:6px;">
        <label for="size">Brush</label>
        <input id="size" type="range" min="2" max="18" value="6"/>
      </div>

      <div class="row" style="margin-top:12px;flex-direction:column;align-items:stretch;">
        <label style="margin-bottom:6px;">Background</label>
        <div class="btnRow">
          <button id="bgGrid" type="button" style="width:50%">Grid: ON</button>
          <button id="bgClear" type="button" style="width:50%">Reset bg</button>
        </div>
      </div>

      <div class="btnRow" style="margin-top:12px;">
        <button id="undo">Undo</button>
        <button id="clear">Clear</button>
      </div>

      <div class="btnRow" style="margin-top:10px;">
        <button id="auto">Auto-doodle</button>
        <button id="stamp">Stamp</button>
      </div>

      <div class="row" style="margin-top:12px;flex-direction:column;align-items:stretch;gap:8px;">
        <button id="chooseRoot" type="button">Choose workshop folder…</button>
        <button id="saveWorkshop" type="button">Save to workshop</button>
        <button id="savePng" type="button">Save PNG</button>
      </div>

      <div id="status">Loaded. Drag to draw.</div>
    </div>

    <div class="stage">
      <canvas id="c"></canvas>
    </div>
  </div>

<script>
(() => {
  const TARS_SAVE_NOW = false;
  const TARS_SAVE_DIRECTLY_ON_LOAD = false;
  const STORAGE_KEY = 'tars_doodle_v1_png';
  const WORKSHOP_DB = 'tars_doodle_workshop_v1';
  const WORKSHOP_STORE = 'handles';
  const WORKSHOP_HANDLE_KEY = 'workshopDir';

  function dateStamp(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function workshopFileName(){ return `doodle-${dateStamp()}.png`; }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const penEl = document.getElementById('pen');
  const colorEl = document.getElementById('color');
  const sizeEl = document.getElementById('size');

  const undoBtn = document.getElementById('undo');
  const clearBtn = document.getElementById('clear');
  const autoBtn = document.getElementById('auto');
  const stampBtn = document.getElementById('stamp');
  const chooseRootBtn = document.getElementById('chooseRoot');
  const saveWorkshopBtn = document.getElementById('saveWorkshop');
  const savePngBtn = document.getElementById('savePng');

  const statusEl = document.getElementById('status');
  const bgGridBtn = document.getElementById('bgGrid');
  const bgClearBtn = document.getElementById('bgClear');

  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let drawing = false;
  let last = null;

  let hasGrid = true;
  const HISTORY_LIMIT = 40;
  let history = [];

  function pen(){ return String(penEl.value || 'brush'); }
  function brush(){
    const hex = String(colorEl.value || '#7cf7ff');
    const h = hex.replace('#','');
    const bigint = parseInt(h.length===3 ? h.split('').map(ch=>ch+ch).join('') : h, 16);
    return { rr:(bigint>>16)&255, gg:(bigint>>8)&255, bb:bigint&255, size:Number(sizeEl.value) };
  }
  function rgba({rr,gg,bb,a}){ return `rgba(${rr},${gg},${bb},${a})`; }

  function updateUndoEnabled(){ undoBtn.disabled = history.length === 0; }
  function snapshot(){
    if (history.length >= HISTORY_LIMIT) history.shift();
    history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    updateUndoEnabled();
  }

  function storageAvailable(){
    try {
      return typeof window.localStorage !== 'undefined';
    } catch (e) {
      return false;
    }
  }

  function saveToLocalStorage(){
    if (!storageAvailable()) return;
    try {
      localStorage.setItem(STORAGE_KEY, canvas.toDataURL('image/png'));
      statusEl.textContent = 'Saved (local).';
    } catch (e) {
      console.error('saveToLocalStorage failed', e);
      statusEl.textContent = 'Save failed.';
    }
  }

  function restoreFromLocalStorage(){
    if (!storageAvailable()) {
      statusEl.textContent = 'Drag to draw. Browser storage unavailable.';
      return;
    }

    let data = null;
    try {
      data = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      console.warn('restoreFromLocalStorage failed', e);
      statusEl.textContent = 'Drag to draw. Browser storage unavailable.';
      return;
    }
    if (!data) { statusEl.textContent = 'No saved doodle yet. Drag to draw.'; return; }
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.restore();
      statusEl.textContent = 'Restored saved doodle.';
    };
    img.src = data;
  }

  function clearHistory(){ history = []; updateUndoEnabled(); }

  function paintBackground(){
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if (hasGrid) {
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#8cb4ff';
      const step = 26;
      for(let x=0;x<W;x+=step){ ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); ctx.stroke(); }
      for(let y=0;y<H;y+=step){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke(); }
      ctx.restore();
    }

    ctx.save();
    const g = ctx.createRadialGradient(W*0.5,H*0.45,10, W*0.5,H*0.45, Math.max(W,H));
    g.addColorStop(0,'rgba(124,247,255,0.09)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function resize(){
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.floor(canvas.clientWidth * DPR));
    const h = Math.max(1, Math.floor(canvas.clientHeight * DPR));
    canvas.width = w;
    canvas.height = h;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    clearHistory();
    paintBackground();
    restoreFromLocalStorage();
  }

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function stampAt(p){
    const b = brush();
    const size = b.size;
    const shape = pen();

    ctx.save();
    ctx.translate(p.x, p.y);

    if (shape === 'pencil'){
      ctx.shadowBlur = 0;
      ctx.fillStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.65});
      ctx.beginPath();
      ctx.arc(0,0, Math.max(1.8, size*0.28), 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }

    if (shape === 'marker'){
      ctx.shadowBlur = 0;
      ctx.fillStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.25});
      ctx.beginPath();
      ctx.arc(0,0, Math.max(2.0, size*0.45), 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }

    if (shape === 'sigil'){
      ctx.shadowColor = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.9});
      ctx.shadowBlur = Math.max(8, size*2.0);
      ctx.rotate(Math.random()*Math.PI*2);
      ctx.strokeStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.92});
      ctx.lineWidth = Math.max(1.6, size*0.35);
      ctx.beginPath();
      const r1 = size*1.4;
      const r2 = size*2.8;
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2;
        ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
        ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
      }
      ctx.stroke();
      ctx.fillStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.92});
      ctx.beginPath();
      ctx.arc(0,0, Math.max(2, size*0.35), 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }

    ctx.shadowColor = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.9});
    ctx.shadowBlur = Math.max(6, size*1.7);
    ctx.fillStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.45});
    ctx.beginPath();
    ctx.arc(0,0, Math.max(2, size*0.42), 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:0.5});
    ctx.beginPath();
    ctx.arc(0,0, Math.max(3, size*0.75), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawLine(from,to){
    const b = brush();
    const shape = pen();

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let lw = b.size;
    let a = 0.85;
    let glow = b.size*1.8;

    if (shape === 'pencil'){
      lw = Math.max(1.2, b.size*0.35);
      a = 0.55;
      glow = 0;
    } else if (shape === 'marker'){
      lw = Math.max(2.0, b.size*1.0);
      a = 0.28;
      glow = 0;
    }

    ctx.lineWidth = lw;
    ctx.strokeStyle = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a});
    ctx.shadowColor = rgba({rr:b.rr,gg:b.gg,bb:b.bb,a:1});
    ctx.shadowBlur = glow;

    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.restore();
  }

  function maybeStampAlong(from,to){
    if (pen() !== 'sigil') return;
    const dist = Math.hypot(to.x-from.x, to.y-from.y);
    const step = Math.max(3, Number(sizeEl.value)*0.45);
    const n = Math.max(1, Math.floor(dist/step));
    for(let i=1;i<=n;i++){
      const t = i/n;
      stampAt({x: from.x + (to.x-from.x)*t, y: from.y + (to.y-from.y)*t});
    }
  }

  function undo(){
    if (history.length === 0) return;
    ctx.putImageData(history.pop(), 0, 0);
    statusEl.textContent = 'Undid last stroke.';
    updateUndoEnabled();
    saveToLocalStorage();
  }

  function clearAll(){
    history = [];
    paintBackground();
    if (storageAvailable()) localStorage.removeItem(STORAGE_KEY);
    statusEl.textContent = 'Cleared (and local save wiped).';
  }

  function randomColor(){
    const r = Math.floor(90 + Math.random()*165);
    const g = Math.floor(90 + Math.random()*165);
    const b = Math.floor(90 + Math.random()*165);
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function autoDoodle(){
    snapshot();
    statusEl.textContent = 'Auto-doodling...';

    const W = canvas.clientWidth;
    const H = canvas.clientHeight;

    const b = brush();
    const col = randomColor();
    colorEl.value = col;

    const start = { x: W*0.2 + Math.random()*W*0.6, y: H*0.25 + Math.random()*H*0.5 };
    let cur = start;
    for(let i=0;i<18;i++){
      const nxt = { x: Math.max(0, Math.min(W, cur.x + (Math.random()-0.5)*W*0.12)), y: Math.max(0, Math.min(H, cur.y + (Math.random()-0.5)*H*0.12)) };
      if (pen() === 'sigil') maybeStampAlong(cur, nxt);
      else drawLine(cur, nxt);
      cur = nxt;
    }
    stampAt(cur);
    saveToLocalStorage();
    statusEl.textContent = 'Auto-doodle done.';
  }

  function stampCenter(){
    snapshot();
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    stampAt({x: W*Math.random(), y: H*Math.random()});
    saveToLocalStorage();
    statusEl.textContent = 'Stamped.';
  }

  function canvasToPngBlob(){
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error('Canvas export returned no PNG data.'));
      }, 'image/png');
    });
  }

  function downloadPng(){
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = workshopFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function supportsWorkshopFolderSave(){
    try {
      return (
        typeof window.showDirectoryPicker === 'function' &&
        typeof window.indexedDB !== 'undefined'
      );
    } catch (e) {
      return false;
    }
  }

  function idbRequest(request){
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB request failed.'));
    });
  }

  function openWorkshopDb(){
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(WORKSHOP_DB, 1);
      request.onupgradeneeded = () => {
        request.result.createObjectStore(WORKSHOP_STORE);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB open failed.'));
    });
  }

  async function readWorkshopDirHandle(){
    const db = await openWorkshopDb();
    try {
      const tx = db.transaction(WORKSHOP_STORE, 'readonly');
      return await idbRequest(tx.objectStore(WORKSHOP_STORE).get(WORKSHOP_HANDLE_KEY));
    } finally {
      db.close();
    }
  }

  async function writeWorkshopDirHandle(handle){
    const db = await openWorkshopDb();
    try {
      const tx = db.transaction(WORKSHOP_STORE, 'readwrite');
      await idbRequest(tx.objectStore(WORKSHOP_STORE).put(handle, WORKSHOP_HANDLE_KEY));
    } finally {
      db.close();
    }
  }

  async function forgetWorkshopDirHandle(){
    const db = await openWorkshopDb();
    try {
      const tx = db.transaction(WORKSHOP_STORE, 'readwrite');
      await idbRequest(tx.objectStore(WORKSHOP_STORE).delete(WORKSHOP_HANDLE_KEY));
    } finally {
      db.close();
    }
  }

  async function verifyDirectoryPermission(handle){
    const options = { mode: 'readwrite' };
    if (typeof handle.queryPermission === 'function') {
      const state = await handle.queryPermission(options);
      if (state === 'granted') return true;
    }
    if (typeof handle.requestPermission === 'function') {
      return await handle.requestPermission(options) === 'granted';
    }
    return false;
  }

  async function writePngToWorkshopDir(rootHandle){
    const stamp = dateStamp();
    const dayDir = await rootHandle.getDirectoryHandle(stamp, { create: true });
    const fileName = `doodle-${stamp}.png`;
    const fileHandle = await dayDir.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    try {
      await writable.write(await canvasToPngBlob());
    } finally {
      await writable.close();
    }
    return `${stamp}/${fileName}`;
  }

  async function chooseWorkshopRoot(){
    if (!supportsWorkshopFolderSave()) {
      statusEl.textContent = 'Folder picker unsupported here. Use Save PNG.';
      return null;
    }
    try {
      statusEl.textContent = 'Choose your tars-workshop root folder.';
      const dirHandle = await window.showDirectoryPicker({
        id: 'tars-doodle-workshop',
        mode: 'readwrite',
      });
      if (!await verifyDirectoryPermission(dirHandle)) {
        statusEl.textContent = 'Workshop folder permission denied.';
        return null;
      }
      await writeWorkshopDirHandle(dirHandle);
      statusEl.textContent = 'Workshop root selected.';
      return dirHandle;
    } catch (e) {
      if (e && e.name === 'AbortError') {
        statusEl.textContent = 'Folder selection cancelled.';
        return null;
      }
      console.warn('chooseWorkshopRoot failed', e);
      statusEl.textContent = 'Could not select workshop folder.';
      return null;
    }
  }

  async function saveToWorkshopFolder(promptIfMissing = true){
    if (!supportsWorkshopFolderSave()) return 'unsupported';

    try {
      let dirHandle = await readWorkshopDirHandle();
      if (!dirHandle || !await verifyDirectoryPermission(dirHandle)) {
        if (!promptIfMissing) {
          statusEl.textContent = 'No workshop folder yet — choose one first.';
          return 'no-handle';
        }
        dirHandle = await chooseWorkshopRoot();
        if (!dirHandle) return 'failed';
      }

      const rel = await writePngToWorkshopDir(dirHandle);
      statusEl.textContent = `Saved ${rel} to workshop.`;
      return 'saved';
    } catch (e) {
      if (e && e.name === 'AbortError') {
        statusEl.textContent = 'Workshop save cancelled.';
        return 'cancelled';
      }

      await forgetWorkshopDirHandle().catch(() => {});
      console.warn('workshop folder save failed; falling back to PNG export', e);
      statusEl.textContent = 'Workshop save failed.';
      return 'failed';
    }
  }

  async function exportPngFallback(){
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: workshopFileName(),
          types: [{
            description: 'PNG image',
            accept: { 'image/png': ['.png'] },
          }],
        });
        const writable = await handle.createWritable();
        await writable.write(await canvasToPngBlob());
        await writable.close();
        statusEl.textContent = 'Saved PNG.';
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') {
          statusEl.textContent = 'Save cancelled.';
          return;
        }
        console.warn('showSaveFilePicker failed; falling back to download', e);
      }
    }

    downloadPng();
    statusEl.textContent = `Downloaded ${workshopFileName()}.`;
  }

  async function saveBestEffort(){
    const result = await saveToWorkshopFolder(true);
    if (result === 'saved' || result === 'cancelled') return;
    await exportPngFallback();
  }

  undoBtn.addEventListener('click', () => undo());
  clearBtn.addEventListener('click', () => clearAll());
  autoBtn.addEventListener('click', () => autoDoodle());
  stampBtn.addEventListener('click', () => stampCenter());
  chooseRootBtn.addEventListener('click', () => chooseWorkshopRoot());
  saveWorkshopBtn.addEventListener('click', () => saveToWorkshopFolder(true));
  savePngBtn.addEventListener('click', () => exportPngFallback());

  bgGridBtn.addEventListener('click', () => {
    hasGrid = !hasGrid;
    bgGridBtn.textContent = `Grid: ${hasGrid ? 'ON' : 'OFF'}`;
    snapshot();
    paintBackground();
    restoreFromLocalStorage();
    saveToLocalStorage();
  });

  bgClearBtn.addEventListener('click', () => {
    snapshot();
    paintBackground();
    restoreFromLocalStorage();
    saveToLocalStorage();
    statusEl.textContent = 'Background reset.';
  });

  window.addEventListener('keydown', (e) => {
    const k = String(e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey){
      e.preventDefault();
      undo();
    }
    if ((e.ctrlKey || e.metaKey) && k === 's'){
      e.preventDefault();
      saveBestEffort();
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    drawing = true;
    snapshot();
    canvas.setPointerCapture(e.pointerId);
    last = getPos(e);
    statusEl.textContent = 'Drawing...';
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = getPos(e);
    const from = last;

    if (pen() === 'sigil') maybeStampAlong(from, p);
    else drawLine(from, p);

    last = p;
    e.preventDefault();
  });

  canvas.addEventListener('pointerup', (e) => {
    if (!drawing) return;
    drawing = false;
    const p = getPos(e);

    const dx = p.x - (last?.x ?? p.x);
    const dy = p.y - (last?.y ?? p.y);
    const moved2 = dx*dx + dy*dy;
    const CLICK2 = 25;

    if (moved2 < CLICK2 || pen() === 'sigil') {
      if (pen() !== 'sigil' || moved2 < CLICK2) stampAt(p);
    }

    last = null;
    statusEl.textContent = 'Done. (Auto-saved locally)';
    saveToLocalStorage();
    e.preventDefault();
  });

  canvas.addEventListener('pointercancel', () => {
    drawing = false;
    last = null;
    statusEl.textContent = 'Cancelled.';
  });

  undoBtn.disabled = true;
  resize();
  setTimeout(() => {
    if (TARS_SAVE_NOW) saveToLocalStorage();
    if (TARS_SAVE_DIRECTLY_ON_LOAD) {
      saveToWorkshopFolder(false).then((result) => {
        if (result === 'no-handle') {
          statusEl.textContent = 'Auto-save needs a workshop folder — choose one first.';
        }
      });
    }
  }, 300);
})();
</script>
</body>
